wine: pazo-barrantes-albarino
dish: aceitunas
explanation: "Mineral meets brine: Rías Baixas salinity locks onto the olive
  cure, the citrus peel in the dressing finds the Albariño’s own, and the acid
  scrubs the oil."
explanationEs: "Lo mineral encuentra la salmuera: la salinidad de Rías Baixas se
  engancha a la curación de la aceituna, la piel de cítrico del aliño encuentra
  la del Albariño y la acidez limpia el aceite."
