wine: gato-negro-blanco-dulce
dish: pasta-con-salsa-de-tomate
explanation: The tomato's acid bullies this wine's modest 3/5 acidity — but
  parmesan salt rescues the pairing by throwing the peach and honeyed fruit into
  sharp relief.
explanationEs: "La acidez del tomate atropella la modesta acidez de 3/5 de este vino, pero la sal del parmesano rescata el maridaje al poner en relieve el melocotón y la fruta melosa."
