wine: moet-chandon-brut-imperial
dish: oysters-raw
explanation: Oysters on the half-shell and Brut Impérial meet at the same weight — brine finds the lemon zest, mousse scrubs the raw liquor clean.
explanationEs: "Las ostras en su concha y el Brut Impérial se encuentran en el mismo registro: la salmuera busca la ralladura de limón, la mousse limpia el licor crudo."
