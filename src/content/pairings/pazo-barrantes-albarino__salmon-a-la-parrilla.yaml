wine: pazo-barrantes-albarino
dish: salmon-a-la-parrilla
explanation: "Pazo Barrantes against grill-marked salmon: acid slices the fat,
  saline minerality locks onto the oily flesh, and the wine's citrus echoes the
  lemon squeeze so cleanly the two feel like one dish."
explanationEs: "Pazo Barrantes frente al salmón marcado a la parrilla: la acidez corta la grasa, la mineralidad salina se aferra a la carne aceitosa, y los cítricos del vino repiten el chorro de limón con tanta limpieza que los dos parecen un solo plato."
