wine: santa-carolina-reservado-carmenere
dish: pollo-con-mole
explanation: Carmenère's acid slices through mole's cacao-fat coat, and the
  green pepper backbone locks onto the dried chile layers without flinching.
explanationEs: "La acidez del Carmenère atraviesa la capa de cacao y grasa del mole, y su columna de pimiento verde se aferra a las capas de chile seco sin pestañear."
