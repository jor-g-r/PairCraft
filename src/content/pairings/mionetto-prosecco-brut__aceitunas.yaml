wine: mionetto-prosecco-brut
dish: aceitunas
explanation: "Bitter olive, sweet pear: the salt ripens Prosecco’s fruit against
  the brine, and the citrus finds the peel in the dressing."
explanationEs: "Aceituna amarga, pera dulce: la sal madura la fruta del Prosecco
  frente a la salmuera, y los cítricos encuentran la piel del aliño."
