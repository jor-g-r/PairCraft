wine: casillero-del-diablo-reserva-cabernet-sauvignon
dish: tabla-de-quesos
explanation: Salt in the manchego and azul pulls the blackcurrant and dark plum forward; go straight for the aged cheeses and let the tannin handle the fat.
explanationEs: La sal del manchego y el azul realza el cassis y la ciruela oscura; apuesta directamente por los quesos curados y deja que el tanino se encargue de la grasa.
