wine: chandon-extra-brut
dish: oysters-raw
explanation: "Chandon Extra Brut against raw oysters on the half-shell: light
  body meets lean brine, and the citrus snap mirrors the lemon already on the
  plate."
explanationEs: "Chandon Extra Brut con ostras crudas en media concha: cuerpo ligero frente a salinidad magra, y el chasquido cítrico repite el limón que ya está en el plato."
