wine: castillo-de-molina-sauvignon-blanc
dish: cerdo-asado
explanation: Cerdo asado's molten fat layers need this blade of acid to reset
  the palate; the salt-forward crackling throws the grapefruit and tropical
  fruit into sharp relief.
explanationEs: "Las capas de grasa fundida del cerdo asado necesitan esta hoja de acidez para reiniciar el paladar; el chicharrón salado pone el pomelo y la fruta tropical en primer plano."
