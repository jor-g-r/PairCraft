wine: mionetto-prosecco-brut
dish: fried-calamari
explanation: "Mionetto Prosecco Brut against fried calamari: bubbles and acid
  strip the fry oil on contact, and the lemon wedge on the plate is already
  telling you what to drink."
explanationEs: "Mionetto Prosecco Brut frente a calamares fritos: la burbuja y la acidez arrastran el aceite de la fritura al contacto, y el limón del plato ya te está diciendo qué beber."
