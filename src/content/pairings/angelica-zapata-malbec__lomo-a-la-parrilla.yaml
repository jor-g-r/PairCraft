wine: angelica-zapata-malbec
dish: lomo-a-la-parrilla
explanation: "Punta de anca off live fire meets Angélica Zapata Malbec at full
  weight: cedar and toast echo the char, tannin strips the fat clean, and the
  coarse salt finish pulls black plum and violet straight to the front."
explanationEs: "La punta de anca a fuego vivo encuentra al Angélica Zapata Malbec en pleno peso: el cedro y el tostado hacen eco de la brasa, el tanino limpia la grasa y el final de sal gruesa trae la ciruela negra y la violeta al frente."
