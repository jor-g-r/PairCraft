wine: gato-negro-blanco-dulce
dish: fried-calamari
explanation: The sweetness carries the peach-and-brine bridge while the acidity
  — modest but present — cuts through the fry oil and resets the palate for the
  next ring.
explanationEs: "El dulzor sostiene el puente entre el melocotón y la salinidad mientras la acidez —modesta pero presente— corta el aceite de la fritura y prepara el paladar para el siguiente aro."
