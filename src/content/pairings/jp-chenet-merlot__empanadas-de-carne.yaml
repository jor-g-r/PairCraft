wine: jp-chenet-merlot
dish: empanadas-de-carne
explanation: "Empanadas ask for no ceremony and neither does JP Chenet: soft
  plum meets the beef, the salt pushes raspberry forward, and gentle tannin
  leaves the ají alone."
explanationEs: "Las empanadas no piden ceremonia y el JP Chenet tampoco: la
  ciruela suave encuentra la carne, la sal adelanta la frambuesa y el tanino
  amable deja tranquilo el ají."
