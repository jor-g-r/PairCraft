wine: catena-malbec
dish: risotto-de-hongos
explanation: Parmesan salt pulls the black plum forward while Malbec's acid
  slices through the butter-glossed cream, and the body holds its ground against
  a bowl built on fat and umami.
explanationEs: "La sal del parmesano adelanta la ciruela negra mientras la acidez del Malbec corta la crema brillante de mantequilla, y el cuerpo se sostiene frente a un plato construido sobre grasa y umami."
