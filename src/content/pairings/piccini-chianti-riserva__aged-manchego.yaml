wine: piccini-chianti-riserva
dish: aged-manchego
explanation: The salt in aged manchego snaps the sour cherry forward, while
  Chianti's acid slices through sheep-milk fat and the leather in both meet on
  common ground.
explanationEs: "La sal del manchego curado adelanta la cereza ácida, mientras la acidez del Chianti corta la grasa de la leche de oveja y el cuero de ambos se encuentra en terreno común."
