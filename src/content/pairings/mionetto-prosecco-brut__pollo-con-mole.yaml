wine: mionetto-prosecco-brut
dish: pollo-con-mole
explanation: "Mionetto Prosecco Brut against mole-braised chicken: the bubbles
  and green-apple acid scrub the cacao-chili fat off your palate between every
  bite, keeping the heat from stacking."
explanationEs: "Mionetto Prosecco Brut frente al pollo en mole: la burbuja y la acidez de manzana verde barren del paladar la grasa de cacao y chile entre bocado y bocado, y el picante no se acumula."
