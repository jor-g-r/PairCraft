wine: leyda-pinot-noir
dish: ceviche
explanation: The lime and onion in the ceviche won't bully this Pinot's acidity,
  and the salt pulls the cherry and raspberry forward.
explanationEs: "El limón y la cebolla del ceviche no avasallan la acidez de este Pinot, y la sal adelanta la cereza y la frambuesa."
