wine: jp-chenet-merlot
dish: lomo-a-la-parrilla
explanation: The coarse salt on punta de anca punches the Merlot's plum and
  cherry forward, and the vanilla oak locks onto the char — but this wine's soft
  tannin and light body will get steamrolled by a thick, fatty sirloin cap, so
  keep the pour cold and the slices thin.
