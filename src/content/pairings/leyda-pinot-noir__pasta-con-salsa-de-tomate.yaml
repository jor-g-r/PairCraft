wine: leyda-pinot-noir
dish: pasta-con-salsa-de-tomate
explanation: Pasta con salsa de tomate — garlic-forward, sharp with tomato acid — meets this cool-climate Pinot's matching acidity head-on, while the parmesan salt pulls the cherry and raspberry forward.
explanationEs: La pasta con salsa de tomate —con ajo pronunciado y la acidez viva del tomate— encuentra en este Pinot de clima frío su contrapunto perfecto, mientras que la sal del parmesano realza las notas de cereza y frambuesa.
