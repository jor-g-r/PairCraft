wine: piccini-chianti-riserva
dish: pollo-con-mole
explanation: Chianti's sour cherry and leather lock into the mole's dried chili
  and cacao — earth meets earth — while the acid slices through the fat coating
  every bite.
explanationEs: "La cereza ácida y el cuero del Chianti se aferran al chile seco y al cacao del mole — tierra con tierra — mientras la acidez corta la grasa que cubre cada bocado."
