wine: norton-malbec
dish: pasta-con-salsa-de-tomate
explanation: Bright tomato sauce needs acid to meet it, and the Malbec's 3/5 acidity holds the line while parmesan salt pulls the black plum and blueberry forward.
explanationEs: La vibrante salsa de tomate exige acidez a su altura, y la acidez moderada del Malbec la sostiene mientras la sal del parmesano realza las notas de ciruela negra y arándano.
