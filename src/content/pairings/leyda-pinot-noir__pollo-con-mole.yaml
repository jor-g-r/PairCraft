wine: leyda-pinot-noir
dish: pollo-con-mole
explanation: Leyda Pinot Noir's bright cherry and spice lock onto the
  cacao-and-dried-chile backbone of mole while the acid slices through the
  fat-coated braised chicken, resetting the palate for the next bite.
explanationEs: "La cereza viva y la especia del Leyda Pinot Noir se aferran a la columna de cacao y chile seco del mole mientras la acidez atraviesa la grasa del pollo guisado y deja el paladar listo para el siguiente bocado."
