wine: castillo-de-molina-sauvignon-blanc
dish: chicharron
explanation: "Acid cuts fat: grapefruit-sharp Sauvignon Blanc works like a
  second squeeze of lime on the crackling, and the salt lifts its tropical
  fruit."
explanationEs: "La acidez corta la grasa: el Sauvignon Blanc, afilado como el
  pomelo, funciona como un segundo chorrito de limón sobre el chicharrón, y la
  sal levanta su fruta tropical."
