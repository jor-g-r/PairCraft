wine: leyda-pinot-noir
dish: fried-calamari
explanation: Leyda Pinot Noir's bright acidity cuts the fry grease on calamari,
  and the light body never buries the squid.
explanationEs: "La acidez viva del Leyda Pinot Noir corta la grasa de la fritura de los calamares, y su cuerpo ligero nunca sepulta al calamar."
