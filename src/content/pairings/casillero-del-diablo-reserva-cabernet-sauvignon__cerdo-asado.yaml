wine: casillero-del-diablo-reserva-cabernet-sauvignon
dish: cerdo-asado
explanation: The salt-forward crackling drives the blackcurrant forward, the
  acid slices through molten fat, and the cedar smoke locks onto the roasted
  crust like it was always meant to be there.
explanationEs: "El chicharrón salado adelanta la grosella negra, la acidez atraviesa la grasa fundida y el humo de cedro se aferra a la corteza asada como si siempre hubiera debido estar ahí."
