wine: jp-chenet-merlot
dish: aged-manchego
explanation: Aged manchego's salt pulls the plum and cherry forward — the fruit
  pops, the cheese softens, and neither bullies the other.
explanationEs: "La sal del manchego curado adelanta la ciruela y la cereza: la fruta estalla, el queso se suaviza y ninguno avasalla al otro."
