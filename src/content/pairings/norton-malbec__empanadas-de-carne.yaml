wine: norton-malbec
dish: empanadas-de-carne
explanation: "Empanadas with Malbec is an Argentine reflex, and it holds on corn
  dough too: tannin meets the stewed beef, acid cuts the fry, and the ají lifts
  plum and blueberry."
explanationEs: "Empanadas con Malbec es un reflejo argentino, y también funciona
  con masa de maíz: el tanino encuentra la carne guisada, la acidez corta la
  fritura y el ají levanta la ciruela y el arándano."
