wine: pazo-barrantes-albarino
dish: pasta-con-salsa-de-tomate
explanation: "Pasta con salsa de tomate — garlic-forward, tomato-sharp — meets
  its match in Pazo Barrantes: acid holds acid, and the parmesan salt pulls the
  peach and citrus forward hard."
explanationEs: "La pasta con salsa de tomate, con mucho ajo y tomate punzante, encuentra su par en Pazo Barrantes: acidez frente a acidez, y la sal del parmesano empuja con fuerza el melocotón y los cítricos."
