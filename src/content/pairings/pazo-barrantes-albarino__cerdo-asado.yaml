wine: pazo-barrantes-albarino
dish: cerdo-asado
explanation: "Pazo Barrantes against cerdo asado: the acidity slices through
  molten pork fat, and the belly's salt pulls the Albariño's peach and citrus
  forward with every bite."
explanationEs: "Pazo Barrantes frente al cerdo asado: la acidez corta la grasa fundida del cerdo, y la sal de la panceta adelanta el melocotón y los cítricos del Albariño en cada bocado."
