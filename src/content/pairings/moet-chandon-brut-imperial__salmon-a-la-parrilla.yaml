wine: moet-chandon-brut-imperial
dish: salmon-a-la-parrilla
explanation: "Moët Brut Impérial against grill-marked salmon: bubbles and acid
  scour the fat, the brioche autolysis echoes the char, and the lemon zest locks
  onto the squeeze already on the plate."
explanationEs: "Moët Brut Impérial frente al salmón marcado a la parrilla: la burbuja y la acidez arrastran la grasa, las notas de brioche de la crianza sobre lías repiten la costra, y la piel de limón se aferra al chorro que ya está en el plato."
