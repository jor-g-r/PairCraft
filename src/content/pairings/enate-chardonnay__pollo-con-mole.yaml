wine: enate-chardonnay
dish: pollo-con-mole
explanation: Braised chicken in mole negro demands a white with real body —
  Enate's butter-and-oak weight stands beside the cacao-chile depth while its
  acid slices the fat coating your palate clean.
explanationEs: "El pollo guisado en mole negro exige un blanco con cuerpo de verdad: el peso de mantequilla y madera del Enate se sostiene junto a la profundidad de cacao y chile mientras su acidez limpia la grasa que cubre el paladar."
