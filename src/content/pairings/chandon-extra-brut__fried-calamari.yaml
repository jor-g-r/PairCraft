wine: chandon-extra-brut
dish: fried-calamari
explanation: "Chandon Extra Brut against fried calamari: carbonation lifts the
  grease, acid resets the palate, and the lemon-zest snap mirrors the squeeze
  you're already reaching for."
explanationEs: "Chandon Extra Brut con calamares fritos: la burbuja levanta la grasa, la acidez limpia el paladar y el chasquido de piel de limón repite el limón que ya ibas a exprimir."
