wine: casillero-del-diablo-reserva-cabernet-sauvignon
dish: pollo-con-mole
explanation: The acid in this Cab slices through mole's cacao-fat coating, and
  the blackcurrant and cedar find a home against the dried chili and toasted
  seed earthiness.
explanationEs: "La acidez de este Cabernet atraviesa la capa de cacao y grasa del mole, y la grosella negra y el cedro encuentran su lugar junto al chile seco y la tierra de las semillas tostadas."
