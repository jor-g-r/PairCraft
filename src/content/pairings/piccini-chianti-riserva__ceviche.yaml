wine: piccini-chianti-riserva
dish: ceviche
explanation: The lime-cured fish and onion sharpness won't bully this Chianti's
  acid, and the salt in the ceviche pulls the sour cherry forward.
explanationEs: "El pescado curado en limón y el filo de la cebolla no avasallan la acidez de este Chianti, y la sal del ceviche adelanta la cereza ácida."
