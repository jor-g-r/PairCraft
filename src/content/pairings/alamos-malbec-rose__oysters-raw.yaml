wine: alamos-malbec-rose
dish: oysters-raw
explanation: Light Malbec rosé against raw oysters — intensity matches, neither bullies the other, and the watermelon fruit pops against the brine.
explanationEs: "Rosado de Malbec ligero con ostras frescas: la intensidad se equilibra, ninguno domina al otro, y la sandía frutal estalla contra el sabor marino."
