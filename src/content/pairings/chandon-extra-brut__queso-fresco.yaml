wine: chandon-extra-brut
dish: queso-fresco
explanation: "Bubbles scrub cream: lemon-zest acid and a fine mousse clear the fresh cheese’s lactic richness bite after bite, and the salt brings up the white peach."
explanationEs: "Las burbujas limpian la crema: la acidez de piel de limón y la burbuja fina despejan la riqueza láctica del queso fresco bocado tras bocado, y la sal realza el melocotón blanco."
