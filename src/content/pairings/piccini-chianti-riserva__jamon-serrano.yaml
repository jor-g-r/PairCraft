wine: piccini-chianti-riserva
dish: jamon-serrano
explanation: "The prosciutto logic, carried to Spain: sour-cherry acid slices
  the fat, dried herbs echo the cure, and the salt softens the Riserva’s grip."
explanationEs: "La lógica del prosciutto, llevada a España: la acidez de cereza
  ácida corta la grasa, las hierbas secas hacen eco de la curación y la sal
  suaviza el agarre del Riserva."
