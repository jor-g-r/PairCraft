wine: alamos-malbec-rose
dish: salmon-a-la-parrilla
explanation: Grilled salmon, herb-crusted and oily, needs the rosé's acid to cut fat and reset the palate — the watermelon and pomegranate land clean against the char without fighting the lemon.
explanationEs: "El salmón a la plancha, con costra de hierbas y su grasa natural, necesita la acidez del rosado para limpiar el paladar: la sandía y la granada aterrizan con limpieza sobre el ahumado sin competir con el limón."
