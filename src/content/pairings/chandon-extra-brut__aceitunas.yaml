wine: chandon-extra-brut
dish: aceitunas
explanation: "Dry bubbles, bitter olives: Extra Brut’s grapefruit pith matches
  the bitter edge, and the salt makes the green apple taste riper."
explanationEs: "Burbuja seca, aceituna amarga: la piel blanca de pomelo del
  Extra Brut iguala el borde amargo, y la sal hace que la manzana verde sepa más
  madura."
