wine: pazo-barrantes-albarino
dish: jamon-serrano
explanation: "Salt answers salt: Albariño’s saline edge meets the cure, its acid
  cuts the fat clean, and the peach plays the ham’s quiet sweetness."
explanationEs: "Sal con sal: el borde salino del Albariño responde a la
  curación, su acidez limpia la grasa y el melocotón juega con el dulzor
  discreto del jamón."
