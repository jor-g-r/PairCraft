wine: alamos-malbec-rose
dish: aceitunas
explanation: "Salt amplifies fruit: the brine pushes the rosé’s watermelon and
  pomegranate forward, and its clean bitter finish answers the olive’s."
explanationEs: "La sal amplifica la fruta: la salmuera adelanta la sandía y la
  granada del rosado, y su final amargo y limpio responde al de la aceituna."
