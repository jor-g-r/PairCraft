wine: mionetto-prosecco-brut
dish: aged-manchego
explanation: "Aged manchego, 12 months: the salt drives the pear and green apple
  forward while bubbles and acid scrub the sheep fat clean."
explanationEs: "Manchego curado, 12 meses: la sal adelanta la pera y la manzana verde mientras la burbuja y la acidez limpian la grasa de oveja."
