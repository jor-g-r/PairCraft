wine: piccini-chianti-riserva
dish: cerdo-asado
explanation: Chianti's razor acidity cuts through pork belly's molten fat
  layers, and the salt-forward crackling throws the sour cherry into sharp
  relief.
explanationEs: "La acidez afilada del Chianti corta las capas de grasa fundida de la panceta, y el chicharrón salado pone la cereza ácida en primer plano."
