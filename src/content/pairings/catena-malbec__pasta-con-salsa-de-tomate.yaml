wine: catena-malbec
dish: pasta-con-salsa-de-tomate
explanation: Parmesan-dusted pasta in sharp tomato sauce pulls the black plum and blackberry out of this Malbec — salt amplifies fruit, acid meets acid, and neither the wine nor the plate flinches.
explanationEs: "La pasta espolvoreada con parmesano en salsa de tomate viva extrae la ciruela negra y la mora de este Malbec: la sal realza la fruta, la acidez se encuentra con la acidez, y ni el vino ni el plato se inmutan."
