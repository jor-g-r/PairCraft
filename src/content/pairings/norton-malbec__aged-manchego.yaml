wine: norton-malbec
dish: aged-manchego
explanation: Aged manchego, 12 months, pulls the black plum and blueberry out of
  this Malbec — salt amplifies fruit — while the sheep-milk fat softens the
  tannin into something clean and direct.
explanationEs: "El manchego curado de 12 meses saca la ciruela negra y el arándano de este Malbec —la sal amplifica la fruta— mientras la grasa de la leche de oveja suaviza el tanino hasta dejarlo limpio y directo."
