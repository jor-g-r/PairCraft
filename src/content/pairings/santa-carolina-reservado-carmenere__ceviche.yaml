wine: santa-carolina-reservado-carmenere
dish: ceviche
explanation: The brine and lime in ceviche will pop the blackberry and plum forward, but this Carmenère's green pepper and medium tannin will fight the delicate fish — order it if nothing better is on the list.
explanationEs: La salmuera y el limón del ceviche realzarán la mora y la ciruela, pero el pimiento verde y el tanino medio de este Carmenère chocarán con el pescado delicado — pídelo si no hay nada mejor en la carta.
