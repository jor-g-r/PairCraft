wine: 1865-cabernet-sauvignon
dish: aged-manchego
explanation: Aged manchego, 12 months, pulls the cassis and blackcurrant out of
  this Maipo Cab hard — salt amplifies fruit — while the sheep-milk fat softens
  those business-end tannins into something the cheese earns.
explanationEs: "El manchego curado de 12 meses saca con fuerza el cassis y la grosella negra de este Cabernet del Maipo — la sal amplifica la fruta — mientras la grasa de la leche de oveja suaviza unos taninos que van en serio hasta volverlos algo que el queso se gana."
