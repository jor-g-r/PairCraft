wine: jp-chenet-merlot
dish: cerdo-asado
explanation: The crackling salt on cerdo asado pulls the plum and cherry
  forward; the vanilla oak locks onto the caramelised roast edge and holds.
explanationEs: "La sal del chicharrón del cerdo asado adelanta la ciruela y la cereza; la vainilla de la madera se aferra al borde caramelizado del asado y no lo suelta."
