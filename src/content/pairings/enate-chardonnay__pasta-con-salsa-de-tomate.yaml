wine: enate-chardonnay
dish: pasta-con-salsa-de-tomate
explanation: Pasta con salsa de tomate — garlic-forward, parmesan-edged — meets its match in a full-bodied Chardonnay where the tomato's acid keeps the wine honest and the salt pulls the ripe apple and pineapple forward.
explanationEs: La pasta con salsa de tomate —con protagonismo del ajo y toque de parmesano— encuentra su pareja ideal en un Chardonnay con cuerpo, donde la acidez del tomate mantiene el vino en su sitio y la sal realza las notas de manzana madura y piña.
