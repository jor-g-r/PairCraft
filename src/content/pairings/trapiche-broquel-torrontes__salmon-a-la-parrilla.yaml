wine: trapiche-broquel-torrontes
dish: salmon-a-la-parrilla
explanation: Torrontés acid cuts salmon fat, and the jasmine-lychee aromatics
  ride the herb crust without fighting the lemon.
explanationEs: "La acidez del Torrontés corta la grasa del salmón, y los aromas de jazmín y lichi acompañan la costra de hierbas sin pelear con el limón."
