wine: casillero-del-diablo-reserva-cabernet-sauvignon
dish: lomo-a-la-parrilla
explanation: Coarse salt on the punta de anca pulls the blackcurrant forward,
  cedar and toast lock onto the char, and firm tannin scrubs the fat clean
  between every bite.
explanationEs: "La sal gruesa sobre la punta de anca adelanta la grosella negra, el cedro y el tostado se aferran a lo carbonizado, y el tanino firme limpia la grasa entre bocado y bocado."
