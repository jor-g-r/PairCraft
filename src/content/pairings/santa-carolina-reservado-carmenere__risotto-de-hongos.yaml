wine: santa-carolina-reservado-carmenere
dish: risotto-de-hongos
explanation: Aged parmesan salt pulls the blackberry and black plum forward
  while Carmenère's acid slices through the butter-glossed cream and resets the
  palate clean.
explanationEs: "La sal del parmesano curado adelanta la mora y la ciruela negra mientras la acidez del Carmenère atraviesa la crema lustrosa de mantequilla y deja el paladar limpio."
