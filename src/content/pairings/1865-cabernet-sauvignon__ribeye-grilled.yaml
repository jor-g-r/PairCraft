wine: 1865-cabernet-sauvignon
dish: ribeye-grilled
explanation: Charred ribeye demands this level of tannin — protein binds the
  grip, fat softens the cedar, and the cassis locks onto the char like it was
  cooked for the wine.
explanationEs: "El ribeye tostado exige este nivel de tanino — la proteína amarra el agarre, la grasa suaviza el cedro y el cassis se engancha al tostado como si lo hubieran cocinado para el vino."
