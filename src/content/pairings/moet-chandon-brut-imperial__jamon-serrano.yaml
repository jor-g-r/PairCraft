wine: moet-chandon-brut-imperial
dish: jamon-serrano
explanation: "Champagne needs no plate beside jamón: the mousse lifts the
  melting fat, the acid resets the palate, and brioche finds the cure’s nutty
  depth."
explanationEs: "Al lado del jamón, el Champagne no necesita plato: la burbuja
  levanta la grasa que se funde, la acidez reinicia el paladar y el brioche
  encuentra la profundidad de nuez de la curación."
