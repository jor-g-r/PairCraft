wine: trapiche-broquel-torrontes
dish: ceviche
explanation: "Lime-cured sea bass ceviche: acid meets acid, the brine pops jasmine and lychee wide open, and the wine's light body never bullies the fish."
explanationEs: "Ceviche de lubina curada en lima: ácido con ácido, la salmuera dispara el jazmín y el lichi, y el cuerpo ligero del vino nunca intimida al pescado."
