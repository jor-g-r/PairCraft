wine: norton-malbec
dish: ribeye-grilled
explanation: Charred ribeye pulls the mocha and cedar out of the Malbec while
  tannin strips the fat and acid resets the bite.
explanationEs: "El ribeye a la parrilla saca la moca y el cedro del Malbec mientras el tanino limpia la grasa y la acidez reinicia cada bocado."
