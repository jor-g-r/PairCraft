wine: garzon-marselan-reserva
dish: pasta-con-salsa-de-tomate
explanation: Pasta con salsa de tomate, garlic-forward and sharp with tomato
  acid, meets its equal in Garzón Marselan — acid holds acid, and the parmesan
  salt pulls the red fruit forward.
explanationEs: "La pasta con salsa de tomate, cargada de ajo y con la acidez afilada del tomate, encuentra su igual en el Garzón Marselan: acidez con acidez, y la sal del parmesano adelanta la fruta roja."
