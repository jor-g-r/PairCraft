wine: jp-chenet-merlot
dish: fried-calamari
explanation: Soft-bodied Merlot meets medium-weight fried calamari without either bullying the other, though the wine's low acid does nothing to cut the fry oil — squeeze the lemon hard.
explanationEs: El Merlot de cuerpo suave se lleva bien con los calamares fritos de peso medio sin que ninguno eclipse al otro, aunque la baja acidez del vino no hace nada por cortar el aceite de la fritura — exprima el limón con ganas.
