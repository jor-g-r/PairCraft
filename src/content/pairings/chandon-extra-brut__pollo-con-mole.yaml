wine: chandon-extra-brut
dish: pollo-con-mole
explanation: "Chandon Extra Brut against mole-braised chicken: carbonation and
  citrus acid scrub the cacao fat off the palate so the chili heat lands clean
  on the next bite."
explanationEs: "Chandon Extra Brut con pollo en mole: la burbuja y la acidez cítrica limpian del paladar la grasa del cacao para que el picante del chile llegue nítido en el siguiente bocado."
