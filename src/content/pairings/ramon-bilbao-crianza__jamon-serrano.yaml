wine: ramon-bilbao-crianza
dish: jamon-serrano
explanation: "Rioja’s oldest habit: the ham’s sweet salt pulls red cherry
  forward, the Crianza’s acid slices the melting fat, and the oak’s vanilla
  meets the cure halfway."
explanationEs: "La costumbre más vieja de Rioja: la sal dulce del jamón adelanta
  la cereza roja, la acidez del Crianza corta la grasa que se funde y la
  vainilla del roble se encuentra con la curación a mitad de camino."
