wine: casillero-del-diablo-reserva-cabernet-sauvignon
dish: fried-calamari
explanation: Skip this pairing — a medium-weight Cab with firm tannin and green
  pepper bulldozes fried calamari; grab a Chablis or Albariño instead, where
  acid cuts the fry fat without the wine tasting like it wandered in from a
  different meal.
