wine: gato-negro-blanco-dulce
dish: aged-manchego
explanation: Aged manchego, 12 months, pulls the peach and honeyed tropical
  fruit out of this sweet white — salt amplifies fruit, fat softens the acid,
  and the crystalline crunch lands clean.
explanationEs: "El manchego curado de 12 meses saca el melocotón y la fruta tropical melosa de este blanco dulce: la sal amplifica la fruta, la grasa suaviza la acidez y el crujido cristalino cierra limpio."
