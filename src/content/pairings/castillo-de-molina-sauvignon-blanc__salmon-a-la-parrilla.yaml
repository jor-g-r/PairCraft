wine: castillo-de-molina-sauvignon-blanc
dish: salmon-a-la-parrilla
explanation: Castillo de Molina's blade of acid cuts the oily salmon flesh
  clean, and the grapefruit-herb notes lock onto the lemon crust and herb coat —
  acid cuts fat, citrus meets citrus.
explanationEs: "La hoja de acidez del Castillo de Molina corta limpia la carne aceitosa del salmón, y las notas de pomelo y hierbas se aferran a la costra de limón y hierbas: la acidez corta la grasa, el cítrico encuentra el cítrico."
