wine: angelica-zapata-malbec
dish: aged-manchego
explanation: The salt in aged manchego, 12-month, detonates the black plum and dark cherry in this Malbec, while the cheese's lanolin-and-earth backbone locks onto the leather and tobacco underneath.
explanationEs: La sal del manchego curado de 12 meses detona la ciruela negra y la cereza oscura de este Malbec, mientras que el fondo de lanolina y tierra del queso se aferra al cuero y al tabaco subyacentes.
