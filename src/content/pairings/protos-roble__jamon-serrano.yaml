wine: protos-roble
dish: jamon-serrano
explanation: "Ribera with jamón, as at any bar in Valladolid: young tannin grips
  the cured protein, acid cuts the fat, and the salt lifts dried plum and
  violet."
explanationEs: "Ribera con jamón, como en cualquier barra de Valladolid: el
  tanino joven se agarra a la proteína curada, la acidez corta la grasa y la sal
  levanta la ciruela pasa y la violeta."
