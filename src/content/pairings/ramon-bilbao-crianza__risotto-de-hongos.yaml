wine: ramon-bilbao-crianza
dish: risotto-de-hongos
explanation: The parmesan salt pulls the red cherry forward, the leather in the
  wine locks onto wild mushroom and aged cheese, and the crianza's acid cuts
  straight through the butter gloss.
explanationEs: "La sal del parmesano adelanta la cereza roja, el cuero del vino se aferra a los hongos silvestres y al queso curado, y la acidez del crianza corta de lleno el brillo de la mantequilla."
