wine: chandon-extra-brut
dish: ceviche
explanation: "Lime-cured corvina with raw onion and ají amarillo meets its equal
  in Chandon Extra Brut: acid locks with acid, the brine pops the green apple,
  and the bubbles scrub the palate clean between bites."
explanationEs: "La corvina curada en limón con cebolla cruda y ají amarillo encuentra su igual en Chandon Extra Brut: acidez con acidez, la salmuera hace estallar la manzana verde y las burbujas limpian el paladar entre bocados."
