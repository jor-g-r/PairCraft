wine: norton-malbec
dish: pollo-con-mole
explanation: Mole's cacao-and-chili weight demands a dark-fruited red with backbone; Malbec's black plum and mocha echo the sauce while its acid slices through the fat coating every bite.
explanationEs: El peso del cacao y el chile del mole exige un tinto de fruta oscura con estructura; la ciruela negra y el moca del Malbec resuenan con la salsa, mientras su acidez corta la grasa que envuelve cada bocado.
