wine: ramon-bilbao-crianza
dish: pollo-con-mole
explanation: Leather and dried chili find the same dark earth; the crianza's
  acid then cuts through mole's fat coat and resets the palate for the next
  bite.
explanationEs: "El cuero y el chile seco encuentran la misma tierra oscura; luego la acidez del crianza corta la capa de grasa del mole y prepara el paladar para el siguiente bocado."
