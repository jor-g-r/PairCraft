wine: leyda-pinot-noir
dish: empanadas-de-carne
explanation: "A light red for a hot snack: low tannin leaves the ají alone, acid
  cuts the fried crust, and cherry and spice sit easily beside the stewed beef."
explanationEs: "Un tinto ligero para un bocado picante: su tanino bajo deja en
  paz el ají, la acidez corta la costra frita y la cereza y las especias se
  acomodan junto a la carne guisada."
