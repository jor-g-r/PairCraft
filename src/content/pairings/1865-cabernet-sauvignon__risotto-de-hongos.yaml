wine: 1865-cabernet-sauvignon
dish: risotto-de-hongos
explanation: Cedar and tobacco in the Cab lock onto wild mushroom and aged parmesan through shared earth, while the parmesan's salt throws the blackcurrant forward and the acid slices clean through the butter gloss.
explanationEs: El cedro y el tabaco del Cabernet se enganchan con el champiñón silvestre y el parmesano curado a través de una terrosidad compartida, mientras que la sal del queso proyecta la grosella negra hacia adelante y la acidez corta limpiamente el brillo mantecoso.
