wine: trapiche-broquel-torrontes
dish: pasta-con-salsa-de-tomate
explanation: Torrontés acid holds the tomato's sharp edge honest, and the parmesan salt detonates the jasmine and white peach.
explanationEs: La acidez del Torrontés sostiene el filo vivo del tomate, y la sal del parmesano detona el jazmín y el melocotón blanco.
