wine: piccini-chianti-riserva
dish: lomo-a-la-parrilla
explanation: Coarse salt on the punta de anca pulls the sour cherry forward, tannin strips the fat off your palate, and Chianti's acid keeps cutting through every bite of that charred crust.
explanationEs: La sal gruesa sobre la punta de anca realza la guinda ácida, el tanino limpia la grasa del paladar y la acidez del Chianti corta sin tregua cada bocado de esa costra chamuscada.
