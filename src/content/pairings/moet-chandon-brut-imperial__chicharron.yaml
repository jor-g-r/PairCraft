wine: moet-chandon-brut-imperial
dish: chicharron
explanation: "Champagne with chicharrón puts high and low at one table: the
  mousse breaks the fat the way the skin breaks, and the acid keeps every bite
  as clean as the first."
explanationEs: "Champagne con chicharrón pone lo alto y lo bajo en la misma
  mesa: la burbuja rompe la grasa como se rompe la piel, y la acidez deja cada
  bocado tan limpio como el primero."
