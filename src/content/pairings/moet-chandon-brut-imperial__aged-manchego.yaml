wine: moet-chandon-brut-imperial
dish: aged-manchego
explanation: "Aged manchego, 12 months, meets Moët Brut Impérial: the sheep's-milk fat surrenders to relentless mousse and high acid, and the salt drives the green apple and white peach straight off the glass."
explanationEs: "Manchego curado de 12 meses con Moët Brut Impérial: la grasa de leche de oveja cede ante la efervescencia incisiva y la alta acidez, mientras la sal dispara la manzana verde y el melocotón blanco fuera de la copa."
