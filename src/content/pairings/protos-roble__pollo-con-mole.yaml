wine: protos-roble
dish: pollo-con-mole
explanation: Protos Roble's cherry-edged acidity cuts through mole's cacao-fat
  coating, resetting the palate so the chili heat lands clean on every bite.
explanationEs: "La acidez con filo de cereza del Protos Roble atraviesa la capa de cacao y grasa del mole y reinicia el paladar, para que el picor del chile llegue limpio en cada bocado."
