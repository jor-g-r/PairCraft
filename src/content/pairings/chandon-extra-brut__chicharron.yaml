wine: chandon-extra-brut
dish: chicharron
explanation: "Bubbles cut richness: Extra Brut scours the pork fat off the
  palate, and its lemon-zest dryness finishes what the squeeze of lime started."
explanationEs: "Las burbujas cortan la riqueza: el Extra Brut barre la grasa de
  cerdo del paladar, y su sequedad de piel de limón termina lo que empezó el
  limón."
