wine: casillero-del-diablo-reserva-cabernet-sauvignon
dish: pasta-con-salsa-de-tomate
explanation: Pasta al pomodoro, bright and garlic-sharp, meets this Cab's
  matching acidity head-on, and the parmesan salt pulls the blackcurrant
  forward.
explanationEs: "La pasta al pomodoro, viva y afilada de ajo, enfrenta de lleno la acidez equivalente de este Cabernet, y la sal del parmesano adelanta la grosella negra."
