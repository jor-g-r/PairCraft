wine: enate-chardonnay
dish: aged-manchego
explanation: Aged manchego, 12 months, pulls the ripe apple and pineapple out of this Somontano Chardonnay — salt amplifies fruit — while the wine's body and acid hold their own against the sheep-milk fat.
explanationEs: El manchego curado de 12 meses realza la manzana madura y la piña de este Chardonnay de Somontano —la sal potencia la fruta— mientras que el cuerpo y la acidez del vino aguantan perfectamente la grasa de la leche de oveja.
