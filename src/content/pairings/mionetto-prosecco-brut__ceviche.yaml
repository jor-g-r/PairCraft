wine: mionetto-prosecco-brut
dish: ceviche
explanation: Lime-cured white fish ceviche and Mionetto Prosecco lock in on
  shared citrus, the brine pops the green apple fruit, and the acid-on-acid
  keeps neither the wine nor the dish from going flat.
explanationEs: "El ceviche de pescado blanco curado en limón y el Mionetto Prosecco se encuentran en los cítricos compartidos, la salmuera hace estallar la manzana verde, y la acidez sobre acidez evita que el vino o el plato se apaguen."
