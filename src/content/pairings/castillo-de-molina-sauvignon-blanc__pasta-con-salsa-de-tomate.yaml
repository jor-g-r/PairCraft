wine: castillo-de-molina-sauvignon-blanc
dish: pasta-con-salsa-de-tomate
explanation: "Pasta con salsa de tomate — garlic-forward, parmesan-edged — meets
  this blade-acid Sauvignon Blanc head-on: acid matches acid, and the salt in
  that aged cheese pulls the grapefruit and herb notes forward."
explanationEs: "La pasta con salsa de tomate, con mucho ajo y un borde de parmesano, enfrenta de lleno a este Sauvignon Blanc de acidez afilada: acidez con acidez, y la sal del queso curado adelanta el pomelo y las hierbas."
