wine: ramon-bilbao-crianza
dish: pasta-con-salsa-de-tomate
explanation: Rioja's red cherry and leather lock onto the tomato's acidity and
  the parmesan's salt — acid holds acid, salt pulls the fruit forward, and the
  leather finds the umami underneath.
explanationEs: "La cereza roja y el cuero del Rioja se aferran a la acidez del tomate y a la sal del parmesano — acidez con acidez, la sal adelanta la fruta y el cuero encuentra el umami de fondo."
