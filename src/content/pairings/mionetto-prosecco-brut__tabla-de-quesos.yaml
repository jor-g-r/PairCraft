wine: mionetto-prosecco-brut
dish: tabla-de-quesos
explanation: Bubbles and acid scrub through queso fresco and manchego; the board's salt pulls the pear and green apple forward so the Prosecco tastes twice as bright.
explanationEs: Las burbujas y la acidez limpian el paladar tras el queso fresco y el manchego; la sal del tablero realza la pera y la manzana verde, haciendo que el Prosecco brille con doble intensidad.
