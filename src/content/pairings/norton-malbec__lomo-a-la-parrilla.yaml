wine: norton-malbec
dish: lomo-a-la-parrilla
explanation: Coarse salt on punta de anca pulls the black plum and blueberry
  forward, tannin strips the fat, and the mocha-cedar backbone locks onto the
  char — this is the pairing Mendoza built itself around.
explanationEs: "La sal gruesa sobre la punta de anca adelanta la ciruela negra y el arándano, el tanino limpia la grasa y la columna de moca y cedro se aferra a la brasa: este es el maridaje alrededor del cual Mendoza se construyó."
