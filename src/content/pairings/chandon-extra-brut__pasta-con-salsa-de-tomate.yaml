wine: chandon-extra-brut
dish: pasta-con-salsa-de-tomate
explanation: Pasta con salsa de tomate, sharp with tomato acid and parmesan salt, meets Chandon Extra Brut on equal acidic footing while the salt snaps the green apple and grapefruit forward.
explanationEs: La pasta con salsa de tomate, de acidez viva y sal de parmesano, encuentra en el Chandon Extra Brut un equilibrio ácido perfecto, mientras que la sal realza las notas de manzana verde y pomelo.
