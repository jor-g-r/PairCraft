wine: leyda-pinot-noir
dish: lomo-a-la-parrilla
explanation: Coarse salt on the punta de anca pulls the cherry and raspberry
  forward; the high acid then cuts the fat and resets the palate clean.
explanationEs: "La sal gruesa sobre la punta de anca adelanta la cereza y la frambuesa; luego la acidez alta corta la grasa y deja el paladar limpio."
