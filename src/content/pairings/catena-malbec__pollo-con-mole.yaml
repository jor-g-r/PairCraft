wine: catena-malbec
dish: pollo-con-mole
explanation: Catena Malbec's body and structure stand beside mole's
  full-throttle weight while the acid slices through the cacao-fat coating
  between bites.
explanationEs: "El cuerpo y la estructura del Catena Malbec se plantan junto al peso a fondo del mole mientras la acidez corta la capa de grasa y cacao entre bocado y bocado."
