wine: garzon-marselan-reserva
dish: cerdo-asado
explanation: The salt in that crackling skin pulls the Marselan's red fruit
  forward while the acidity slices through molten pork fat — the wine resets,
  the belly rewards, repeat.
explanationEs: "La sal de esa piel crujiente adelanta la fruta roja del Marselan mientras la acidez corta la grasa fundida del cerdo: el vino limpia, la panceta recompensa, y vuelta a empezar."
