wine: moet-chandon-brut-imperial
dish: pollo-con-mole
explanation: Mole-braised chicken — cacao-thick, chile-hot, fat-heavy — gets
  scrubbed clean by Brut Impérial's mousse and green-apple acid between every
  bite.
explanationEs: "El pollo en mole, espeso de cacao, picante de chile y cargado de grasa, queda limpio entre bocado y bocado gracias a la burbuja y la acidez de manzana verde del Brut Impérial."
