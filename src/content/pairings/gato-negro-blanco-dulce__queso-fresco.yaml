wine: gato-negro-blanco-dulce
dish: queso-fresco
explanation: "Sweet meets salt, the logic of queso con bocadillo: honeyed peach plays the guava paste against the fresh cheese, and the wine’s acid stops the sugar from cloying."
explanationEs: "Dulce contra sal, la lógica del queso con bocadillo: el melocotón meloso hace de bocadillo frente al queso fresco, y la acidez del vino evita que el azúcar empalague."
