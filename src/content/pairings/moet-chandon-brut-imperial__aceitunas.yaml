wine: moet-chandon-brut-imperial
dish: aceitunas
explanation: "Olives are the Champagne snack that costs nothing: the brine
  sharpens the mousse, the oil softens the acid, and the salt pulls pear and
  white peach forward."
explanationEs: "Las aceitunas son el bocado de Champagne que no cuesta nada: la
  salmuera afila la burbuja, el aceite suaviza la acidez y la sal adelanta la
  pera y el melocotón blanco."
