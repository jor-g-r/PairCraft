wine: garzon-marselan-reserva
dish: risotto-de-hongos
explanation: Risotto de hongos — butter-fat, parmesan salt, wild mushroom umami
  — finds its match in the Marselan's acid cutting the cream clean while the
  salt wall pulls the red fruit forward and makes it sing.
explanationEs: "El risotto de hongos —grasa de mantequilla, sal de parmesano, umami de hongos silvestres— encuentra su pareja en el Marselan: la acidez limpia la crema mientras el muro de sal adelanta la fruta roja y la hace cantar."
