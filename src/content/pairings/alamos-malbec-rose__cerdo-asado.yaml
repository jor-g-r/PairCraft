wine: alamos-malbec-rose
dish: cerdo-asado
explanation: "Roasted pork belly, crackling skin, against Alamos Malbec Rosé:
  the salt drives the watermelon and pomegranate forward, the acid cuts through
  molten fat, and the faint sweetness holds its ground against the caramelised
  edge."
explanationEs: "Panceta asada de piel crujiente con Alamos Malbec Rosé: la sal empuja la sandía y la granada, la acidez corta la grasa fundida y el leve dulzor se sostiene frente al borde caramelizado."
