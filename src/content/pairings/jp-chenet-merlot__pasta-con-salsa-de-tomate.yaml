wine: jp-chenet-merlot
dish: pasta-con-salsa-de-tomate
explanation: Pasta con salsa de tomate — sharp tomato, garlic, parmesan — pulls
  the plum and cherry out of this Merlot; salt amplifies fruit.
explanationEs: "La pasta con salsa de tomate —tomate afilado, ajo, parmesano— saca la ciruela y la cereza de este Merlot; la sal amplifica la fruta."
