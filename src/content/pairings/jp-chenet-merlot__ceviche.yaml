wine: jp-chenet-merlot
dish: ceviche
explanation: The salt in lime-cured fish pulls the plum and cherry forward, and
  the wine's light body won't drown what the citrus worked hard to build.
explanationEs: "La sal del pescado curado en limón adelanta la ciruela y la cereza, y el cuerpo ligero del vino no ahoga lo que los cítricos construyeron con esfuerzo."
