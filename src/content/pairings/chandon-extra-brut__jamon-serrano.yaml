wine: chandon-extra-brut
dish: jamon-serrano
explanation: Bubbles scrub the fat off every slice, and Extra Brut’s lemon-zest
  dryness keeps the ham’s salt tasting sweet rather than heavy.
explanationEs: Las burbujas barren la grasa de cada loncha, y la sequedad de
  piel de limón del Extra Brut hace que la sal del jamón sepa dulce en vez de
  pesada.
