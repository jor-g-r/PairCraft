wine: leyda-pinot-noir
dish: queso-fresco
explanation: "Leyda Pinot is red enough to matter and light enough for fresh cheese: low tannin leaves the curd alone, cool-climate acid cuts the cream, and salt brightens the cherry."
explanationEs: "El Pinot de Leyda es lo bastante tinto para importar y lo bastante ligero para el queso fresco: su tanino bajo respeta el queso, la acidez de clima frío corta la crema y la sal aviva la cereza."
