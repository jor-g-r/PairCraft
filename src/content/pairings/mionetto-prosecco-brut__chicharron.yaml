wine: mionetto-prosecco-brut
dish: chicharron
explanation: "Fried pork wants bubbles: Prosecco’s pear and green apple turn
  sweet against the salt, and the fizz lifts the fat before it settles."
explanationEs: "El cerdo frito pide burbujas: la pera y la manzana verde del
  Prosecco se endulzan frente a la sal, y la burbuja levanta la grasa antes de
  que se asiente."
