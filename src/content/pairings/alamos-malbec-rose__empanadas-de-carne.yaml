wine: alamos-malbec-rose
dish: empanadas-de-carne
explanation: "Sweetness cuts spice: the rosé’s faint sugar calms the ají, its
  acid cuts the fry, and the salt turns strawberry and watermelon brighter."
explanationEs: "El dulzor corta el picante: el leve azúcar del rosado apacigua
  el ají, su acidez corta la fritura y la sal aviva la fresa y la sandía."
