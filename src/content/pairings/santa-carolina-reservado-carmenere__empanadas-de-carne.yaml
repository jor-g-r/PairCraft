wine: santa-carolina-reservado-carmenere
dish: empanadas-de-carne
explanation: "Chile eats its empanadas with Carmenère for a reason: green pepper
  and dried herbs meet the ají head-on, and the tannin holds the beef."
explanationEs: "Chile come sus empanadas con Carmenère por algo: el pimiento
  verde y las hierbas secas enfrentan el ají de lleno, y el tanino sostiene la
  carne."
