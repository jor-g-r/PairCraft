wine: garzon-marselan-reserva
dish: pollo-con-mole
explanation: Marselan's body and mineral grip hold their ground against mole's
  cacao-and-chili mass; acidity cuts the fat between bites.
explanationEs: "El cuerpo y el agarre mineral del Marselan se sostienen frente a la masa de cacao y chile del mole; la acidez corta la grasa entre bocado y bocado."
