wine: trapiche-broquel-torrontes
dish: empanadas-de-carne
explanation: "In Salta, Torrontés is what empanadas are washed down with:
  jasmine and white peach lift the ají, and grapefruit-zest acid cuts the fry."
explanationEs: "En Salta, el Torrontés es lo que acompaña a las empanadas: el
  jazmín y el melocotón blanco levantan el ají, y la acidez de ralladura de
  pomelo corta la fritura."
