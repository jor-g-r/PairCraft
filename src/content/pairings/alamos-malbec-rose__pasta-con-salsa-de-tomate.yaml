wine: alamos-malbec-rose
dish: pasta-con-salsa-de-tomate
explanation: Pasta con salsa de tomate, garlic-forward with a sharp tomato edge,
  meets its match in this rosé — acid holds acid, and the parmesan salt snaps
  the watermelon and pomegranate wide open.
explanationEs: "La pasta con salsa de tomate, con protagonismo del ajo y un filo de tomate marcado, encuentra su par en este rosado — acidez con acidez, y la sal del parmesano abre de par en par la sandía y la granada."
