wine: alamos-malbec-rose
dish: ceviche
explanation: The brine and lime in white fish ceviche snap the watermelon and
  pomegranate forward, while the wine's residual sugar holds the chili in check
  — light meeting light, acid meeting acid, salt doing the rest.
explanationEs: "La salmuera y el limón del ceviche de pescado blanco hacen estallar la sandía y la granada, mientras el azúcar residual del vino mantiene a raya el ají — ligero con ligero, acidez con acidez, y la sal hace el resto."
