wine: trapiche-broquel-torrontes
dish: queso-fresco
explanation: "Fresh cheese stays out of Torrontés’s way: the mild curd lets jasmine and lychee lead, and its salt sharpens the grapefruit-zest finish."
explanationEs: "El queso fresco no le estorba al Torrontés: su suavidad deja que el jazmín y el lichi lleven la voz, y su sal afila el final de piel de pomelo."
