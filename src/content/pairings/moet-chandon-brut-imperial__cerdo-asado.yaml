wine: moet-chandon-brut-imperial
dish: cerdo-asado
explanation: "Crackling pork belly meets its match: acid and relentless mousse
  scour the molten fat, and the salt of the skin throws the green apple and
  white peach into sharp relief."
explanationEs: "La panceta crujiente encuentra su par: la acidez y la burbuja incansable arrastran la grasa fundida, y la sal de la piel pone en primer plano la manzana verde y el melocotón blanco."
