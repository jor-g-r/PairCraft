wine: alamos-malbec-rose
dish: pollo-con-mole
explanation: "Alamos Malbec Rosé against pollo con mole: watermelon and
  pomegranate fruit cool the dried-chile heat, the residual sweetness holds the
  cacao's bitterness in check, and the acid cuts through the braising fat to
  reset the palate for the next bite."
explanationEs: "Alamos Malbec Rosé con pollo en mole: la sandía y la granada refrescan el picante del chile seco, el dulzor residual mantiene a raya el amargor del cacao y la acidez corta la grasa del guiso para preparar el paladar para el siguiente bocado."
