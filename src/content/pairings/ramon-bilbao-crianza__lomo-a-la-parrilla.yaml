wine: ramon-bilbao-crianza
dish: lomo-a-la-parrilla
explanation: Coarse salt on the punta de anca pulls the red cherry forward,
  tannin strips the fat clean, and the vanilla oak locks into the char like they
  came off the same fire.
explanationEs: "La sal gruesa sobre la punta de anca adelanta la cereza roja, el tanino limpia la grasa y la vainilla del roble se engancha al tostado como si hubieran salido del mismo fuego."
