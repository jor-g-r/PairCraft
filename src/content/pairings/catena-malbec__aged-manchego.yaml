wine: catena-malbec
dish: aged-manchego
explanation: Aged manchego, 12 months, pulls the black plum and blackberry out
  of this Malbec — salt amplifies fruit, acid resets the fat, and the weight of
  both lands in the same register.
explanationEs: "El manchego curado de 12 meses saca la ciruela negra y la mora de este Malbec: la sal amplifica la fruta, la acidez limpia la grasa y el peso de ambos cae en el mismo registro."
