wine: enate-chardonnay
dish: ribeye-grilled
explanation: Enate Chardonnay's toasted oak and vanilla lock onto the char of a
  ribeye while its acidity slices through the fat — weight meets weight, wood
  meets smoke.
explanationEs: "La madera tostada y la vainilla del Enate Chardonnay se aferran a la brasa del ribeye mientras su acidez corta la grasa: peso con peso, madera con humo."
