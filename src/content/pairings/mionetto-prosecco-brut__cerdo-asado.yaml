wine: mionetto-prosecco-brut
dish: cerdo-asado
explanation: Prosecco's acid and carbonation scrub through pork belly's molten
  fat layers, and the crackling's salt snaps the green apple fruit into focus.
explanationEs: "La acidez y la burbuja del Prosecco atraviesan las capas de grasa fundida del cerdo asado, y la sal del chicharrón pone en foco la manzana verde."
