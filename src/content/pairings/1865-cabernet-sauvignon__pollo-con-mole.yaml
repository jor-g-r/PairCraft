wine: 1865-cabernet-sauvignon
dish: pollo-con-mole
explanation: Cedar and tobacco in the wine lock onto the mole's cacao and dried
  chili; tannin meets braised fat, and the acidity resets a sauce that would
  bury a lighter red.
explanationEs: "El cedro y el tabaco del vino se aferran al cacao y al chile seco del mole; el tanino encuentra la grasa del guiso, y la acidez reinicia una salsa que enterraría a un tinto más ligero."
