wine: gato-negro-blanco-dulce
dish: pollo-con-mole
explanation: "Gato Negro Blanco Dulce against pollo con mole: honeyed peach
  sweetness tames the dried-chile heat, and the residual sugar meets the cacao's
  bitter edge without flinching."
explanationEs: "Gato Negro Blanco Dulce frente al pollo con mole: el dulzor meloso de melocotón doma el picor del chile seco, y el azúcar residual enfrenta el borde amargo del cacao sin inmutarse."
