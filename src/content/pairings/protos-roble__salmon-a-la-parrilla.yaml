wine: protos-roble
dish: salmon-a-la-parrilla
explanation: Cedar and light toast in the Protos lock onto the grill char while
  the acidity slices through salmon's oil-rich flesh, resetting the palate for
  the next bite.
explanationEs: "El cedro y el tostado ligero del Protos se aferran a las marcas de la parrilla mientras la acidez corta la carne aceitosa del salmón y reinicia el paladar para el siguiente bocado."
