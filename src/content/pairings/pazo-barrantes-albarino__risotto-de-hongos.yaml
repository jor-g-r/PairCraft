wine: pazo-barrantes-albarino
dish: risotto-de-hongos
explanation: The screaming acidity of Pazo Barrantes slices through
  butter-glossed Arborio and aged parmesan fat, while the risotto's salt pulls
  the wine's peach and citrus forward with every bite.
explanationEs: "La acidez estridente de Pazo Barrantes atraviesa el arborio brillante de mantequilla y la grasa del parmesano curado, mientras la sal del risotto adelanta el melocotón y los cítricos del vino en cada bocado."
