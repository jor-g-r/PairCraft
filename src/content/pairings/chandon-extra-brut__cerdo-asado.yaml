wine: chandon-extra-brut
dish: cerdo-asado
explanation: "Crackling pork belly needs this: carbonation lifts the fat, acid
  resets the palate, and the salt on that skin makes the green apple and
  grapefruit snap louder than they have any right to."
explanationEs: "La panceta crujiente pide esto: la burbuja levanta la grasa, la acidez limpia el paladar y la sal de la piel hace que la manzana verde y el pomelo suenen más fuerte de lo que tienen derecho."
