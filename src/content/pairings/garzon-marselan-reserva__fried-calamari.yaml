wine: garzon-marselan-reserva
dish: fried-calamari
explanation: Marselan's mineral grit and mid-weight acidity cut the fry fat and
  lock onto the calamari's brine in the same move.
explanationEs: "La aspereza mineral y la acidez media del Marselan cortan la grasa de la fritura y se aferran a la salinidad del calamar en el mismo movimiento."
