wine: ramon-bilbao-crianza
dish: fried-calamari
explanation: Fried calamari's oil and batter demand acid to reset the palate,
  and the Crianza's cherry-driven acidity does exactly that without bulldozing
  the squid.
explanationEs: "El aceite y el rebozado de los calamares fritos piden acidez para limpiar el paladar, y la acidez de cereza del Crianza hace exactamente eso sin aplastar el calamar."
