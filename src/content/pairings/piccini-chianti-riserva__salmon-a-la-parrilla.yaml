wine: piccini-chianti-riserva
dish: salmon-a-la-parrilla
explanation: Chianti's sour cherry acid cuts through salmon's oil, and the herb crust locks onto those dried-herb notes so the fish doesn't disappear against the wine's structure.
explanationEs: La acidez de cereza ácida del Chianti corta la grasa del salmón, y la costra de hierbas se engancha con las notas de hierbas secas del vino para que el pescado no quede eclipsado por su estructura.
