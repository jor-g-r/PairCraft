wine: chandon-extra-brut
dish: empanadas-de-carne
explanation: "Bubbles cut fried dough: Extra Brut scrubs the oil off the palate
  between bites, and its lemon zest freshens the ají."
explanationEs: "Las burbujas cortan la masa frita: el Extra Brut barre el aceite
  del paladar entre bocado y bocado, y su piel de limón refresca el ají."
