wine: protos-roble
dish: lomo-a-la-parrilla
explanation: Coarse salt on punta de anca pulls the red cherry and dried plum
  forward, the cedar and light toast lock onto the char, and moderate tannin
  scrubs the fat clean between every bite.
explanationEs: "La sal gruesa sobre la punta de anca adelanta la cereza roja y la ciruela pasa, el cedro y el tostado ligero se aferran a la costra, y el tanino moderado limpia la grasa entre bocado y bocado."
