wine: norton-malbec
dish: fried-calamari
explanation: Fried calamari needs acid to cut the oil, and this Malbec's acidity
  does the work while the dark plum weight meets the dish without crushing it.
explanationEs: "Los calamares fritos piden acidez para cortar el aceite, y la acidez de este Malbec hace el trabajo mientras el peso de ciruela oscura acompaña el plato sin aplastarlo."
