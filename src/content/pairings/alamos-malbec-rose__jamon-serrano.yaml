wine: alamos-malbec-rose
dish: jamon-serrano
explanation: "Pink with pink: thin-cut jamón brightens the rosé’s strawberry and
  pomegranate, and the acid lifts the fat before it coats the mouth."
explanationEs: "Rosado con rosado: el jamón en lonchas finas aviva la fresa y la
  granada del vino, y la acidez levanta la grasa antes de que cubra la boca."
