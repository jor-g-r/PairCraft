wine: castillo-de-molina-sauvignon-blanc
dish: queso-fresco
explanation: "Acid cuts cream: grapefruit and green herbs slice through the fresh cheese’s lactic softness, and its salt pulls the citrus forward."
explanationEs: "La acidez corta la crema: el pomelo y las hierbas verdes atraviesan la suavidad láctica del queso fresco, y su sal adelanta los cítricos."
