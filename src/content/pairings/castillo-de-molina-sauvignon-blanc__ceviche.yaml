wine: castillo-de-molina-sauvignon-blanc
dish: ceviche
explanation: "Lime-cured corvina ceviche: the wine's blade-acid matches the
  dish's citrus attack, the salt pops grapefruit, and shared herb-and-citrus
  aromatics lock the two into one flavor."
explanationEs: "Ceviche de corvina curado en lima: la acidez afilada del vino iguala el ataque cítrico del plato, la sal hace estallar el pomelo, y los aromas compartidos de hierbas y cítricos funden a los dos en un solo sabor."
