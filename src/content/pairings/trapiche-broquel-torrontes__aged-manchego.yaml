wine: trapiche-broquel-torrontes
dish: aged-manchego
explanation: "Aged manchego, 18 months: the salt detonates the lychee and white peach, and the acid slices through sheep-fat before it coats."
explanationEs: "Manchego curado de 18 meses: la sal detona el lichi y el melocotón blanco, y la acidez corta la grasa de oveja antes de que llegue a cubrir el paladar."
