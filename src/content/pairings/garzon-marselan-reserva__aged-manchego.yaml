wine: garzon-marselan-reserva
dish: aged-manchego
explanation: Aged manchego, 12 months, pulls the red fruit out of this Marselan
  and lets the acidity scrub the lanolin fat clean off your palate.
explanationEs: "El manchego curado de 12 meses saca la fruta roja de este Marselan y deja que la acidez limpie del paladar su grasa de lanolina."
