wine: mionetto-prosecco-brut
dish: risotto-de-hongos
explanation: Risotto de hongos — butter-glossed, parmesan-salted, dense with
  wild mushroom fat — gets scrubbed clean by Prosecco's carbonation and acid,
  and the parmesan salt snaps the green apple fruit into focus with every sip.
explanationEs: "El risotto de hongos —lustroso de mantequilla, salado de parmesano, denso con la grasa de los hongos silvestres— queda limpio con la burbuja y la acidez del Prosecco, y la sal del parmesano pone en foco la manzana verde en cada sorbo."
