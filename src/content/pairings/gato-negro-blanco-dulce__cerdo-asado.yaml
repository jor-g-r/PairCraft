wine: gato-negro-blanco-dulce
dish: cerdo-asado
explanation: The salt crust on cerdo asado detonates the peach and honeyed fruit
  in Gato Negro Blanco Dulce; sweetness meets caramelised pork fat, and what
  little acid is there does the reset work.
explanationEs: "La costra salada del cerdo asado hace detonar el melocotón y la fruta melosa del Gato Negro Blanco Dulce; el dulzor encuentra la grasa caramelizada del cerdo, y la poca acidez que hay hace el trabajo de limpieza."
