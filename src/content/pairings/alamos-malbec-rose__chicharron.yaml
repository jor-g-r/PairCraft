wine: alamos-malbec-rose
dish: chicharron
explanation: "Rosé is the easy answer at a fritanga: acid cuts the pork fat, and
  the salt turns strawberry and watermelon brighter with every bite."
explanationEs: "El rosado es la respuesta fácil en una fritanga: la acidez corta
  la grasa del cerdo, y la sal aviva la fresa y la sandía en cada bocado."
