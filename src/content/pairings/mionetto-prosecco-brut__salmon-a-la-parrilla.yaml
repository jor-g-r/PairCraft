wine: mionetto-prosecco-brut
dish: salmon-a-la-parrilla
explanation: Prosecco's acid and carbonation scrub salmon fat off the palate; the citrus and herb notes in both lock the pairing into place.
explanationEs: La acidez y el carbónico del Prosecco limpian la grasa del salmón en el paladar; las notas cítricas y herbáceas de ambos sellan la armonía.
