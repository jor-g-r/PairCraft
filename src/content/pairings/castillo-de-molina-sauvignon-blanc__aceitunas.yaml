wine: castillo-de-molina-sauvignon-blanc
dish: aceitunas
explanation: Grapefruit and green herbs meet the citrus peel and garlic head-on,
  and the Sauvignon’s sharp acid stands up to the brine.
explanationEs: El pomelo y las hierbas verdes enfrentan de lleno la piel de
  cítrico y el ajo, y la acidez afilada del Sauvignon resiste la salmuera.
