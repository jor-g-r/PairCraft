wine: gato-negro-blanco-dulce
dish: ceviche
explanation: "Lime-cured corvina ceviche with fresh ají: the wine's residual sugar tames the chili heat, its peach and honeyed fruit pops against the salt and brine, and the light body never buries the delicate fish."
explanationEs: "Ceviche de corvina marinada en lima con ají fresco: el azúcar residual del vino domina el picante, sus notas de melocotón y fruta melosa resaltan frente a la sal y el escabeche, y su cuerpo ligero no opaca el delicado pescado."
