wine: alamos-malbec-rose
dish: aged-manchego
explanation: Aged manchego, 12 months, pulls the watermelon and pomegranate
  forward — salt amplifies fruit — while the rosé's acid cuts through sheep-milk
  fat cleanly.
explanationEs: "El manchego curado de 12 meses adelanta la sandía y la granada — la sal amplifica la fruta — mientras la acidez del rosado corta limpiamente la grasa de la leche de oveja."
