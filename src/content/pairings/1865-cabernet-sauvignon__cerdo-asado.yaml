wine: 1865-cabernet-sauvignon
dish: cerdo-asado
explanation: The salt-forward crackling and molten fat of cerdo asado unlock the cassis and blackcurrant in this Maipo Cab while the tannins scour the fat clean — weight meets weight, and cedar meets the roast.
explanationEs: "La corteza crujiente y salada y la grasa fundente del cerdo asado liberan el cassis y la grosella negra de este Cabernet del Maipo, mientras los taninos limpian la grasa con precisión: peso con peso, cedro con asado."
