wine: casillero-del-diablo-reserva-cabernet-sauvignon
dish: salmon-a-la-parrilla
explanation: The cedar and toast in this Cab lock onto the salmon's grill char
  while the acidity slices through the oily flesh — fat softens the tannin,
  tannin cleans the fat.
explanationEs: "El cedro y el tostado de este Cabernet se aferran a la marca de la parrilla del salmón mientras la acidez atraviesa la carne grasa: la grasa suaviza el tanino y el tanino limpia la grasa."
