wine: gato-negro-blanco-dulce
dish: risotto-de-hongos
explanation: The parmesan's salt pulls the peach and honeyed fruit forward, but this wine's low acid gets buried under butter-glossed Arborio — order it anyway, because salt amplifies fruit and the contrast carries the glass.
explanationEs: "La sal del parmesano realza el melocotón y los aromas afrutados con matices de miel, pero la baja acidez de este vino queda sepultada bajo el Arborio con mantequilla. Pídalo de todas formas: la sal potencia la fruta y el contraste sostiene la copa."
