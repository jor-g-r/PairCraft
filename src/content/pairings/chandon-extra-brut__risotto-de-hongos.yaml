wine: chandon-extra-brut
dish: risotto-de-hongos
explanation: Chandon Extra Brut against risotto de hongos — butter-glossed
  Arborio, wild mushrooms, aged parmesan — acid and carbonation scrub the fat
  clean while the parmesan salt pulls the green apple and grapefruit pith
  forward.
explanationEs: "Chandon Extra Brut con risotto de hongos (arborio con brillo de mantequilla, hongos silvestres y parmesano curado): la acidez y la burbuja limpian la grasa, mientras la sal del parmesano adelanta la manzana verde y la piel de pomelo."
