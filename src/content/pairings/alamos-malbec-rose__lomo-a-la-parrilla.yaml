wine: alamos-malbec-rose
dish: lomo-a-la-parrilla
explanation: Coarse salt on punta de anca pulls the watermelon and pomegranate forward while the rosé's acid slices clean through the char fat — order a second glass.
explanationEs: La sal gruesa en la punta de anca realza la sandía y la granada, mientras que la acidez del rosado corta limpiamente la grasa del asado. Pide otra copa.
