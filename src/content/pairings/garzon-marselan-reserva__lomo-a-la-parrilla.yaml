wine: garzon-marselan-reserva
dish: lomo-a-la-parrilla
explanation: Coarse salt on punta de anca pulls the Marselan's red fruit forward
  while tannin meets protein and acid cuts the fat — this is the parrilla wine
  Uruguay forgot to tell you about.
explanationEs: "La sal gruesa sobre la punta de anca adelanta la fruta roja del Marselan mientras el tanino encuentra la proteína y la acidez corta la grasa: este es el vino de parrilla del que Uruguay olvidó hablarte."
