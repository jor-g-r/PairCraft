wine: santa-carolina-reservado-carmenere
dish: salmon-a-la-parrilla
explanation: Grilled salmon, herb-crusted and oily, meets the Carmenère's cedar and light toast note-for-note while the acid slices through the fat and resets the palate clean.
explanationEs: El salmón a la parrilla, con costra de hierbas y su grasa característica, encuentra en el Carmenère sus notas de cedro y tostado ligero en perfecta sintonía, mientras la acidez corta la grasa y deja el paladar limpio y fresco.
