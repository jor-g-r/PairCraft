wine: leyda-pinot-noir
dish: aged-manchego
explanation: "Aged manchego, 12 months, and this cool-climate Pinot: salt
  amplifies the cherry and raspberry, acid cuts the sheep-fat, and neither
  buries the other."
explanationEs: "Manchego curado de 12 meses y este Pinot de clima frío: la sal amplifica la cereza y la frambuesa, la acidez corta la grasa de oveja y ninguno sepulta al otro."
