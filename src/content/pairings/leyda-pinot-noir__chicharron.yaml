wine: leyda-pinot-noir
dish: chicharron
explanation: "A red that respects crackling: cool-climate acid cuts the fat, low
  tannin leaves the crisp skin alone, and the salt pulls cherry and raspberry
  forward."
explanationEs: "Un tinto que respeta el chicharrón: la acidez de clima frío
  corta la grasa, el tanino bajo deja en paz la piel crujiente y la sal adelanta
  la cereza y la frambuesa."
