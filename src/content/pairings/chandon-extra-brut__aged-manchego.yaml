wine: chandon-extra-brut
dish: aged-manchego
explanation: "Aged manchego, 12 months, meets Chandon Extra Brut: salt amplifies
  the green apple and white peach, while acid and carbonation scrub the
  sheep-fat clean off the palate."
explanationEs: "Manchego curado de 12 meses con Chandon Extra Brut: la sal amplifica la manzana verde y el melocotón blanco, mientras la acidez y la burbuja limpian del paladar la grasa de oveja."
