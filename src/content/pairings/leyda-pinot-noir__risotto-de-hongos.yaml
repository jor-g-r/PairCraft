wine: leyda-pinot-noir
dish: risotto-de-hongos
explanation: The parmesan salt pulls the cherry and raspberry forward while the
  wine's acid slices through the butter-glossed risotto, and the shared
  earthiness locks the whole thing together.
explanationEs: "La sal del parmesano adelanta la cereza y la frambuesa mientras la acidez del vino atraviesa el risotto lustroso de mantequilla, y la tierra compartida lo amarra todo."
