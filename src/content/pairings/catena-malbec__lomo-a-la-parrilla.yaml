wine: catena-malbec
dish: lomo-a-la-parrilla
explanation: Coarse salt on punta de anca pulls the black plum and violet forward while tannin strips the fat clean — this is the pairing Mendoza was built around.
explanationEs: "La sal gruesa sobre la punta de anca realza la ciruela negra y la violeta, mientras que el tanino limpia la grasa con precisión: este es el maridaje para el que Mendoza fue hecha."
