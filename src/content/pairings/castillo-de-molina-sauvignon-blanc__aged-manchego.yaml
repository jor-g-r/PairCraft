wine: castillo-de-molina-sauvignon-blanc
dish: aged-manchego
explanation: "Aged manchego, 12 months: the sheep-fat richness needs this blade of acid, and the salt throws the grapefruit wide open."
explanationEs: "Manchego curado de 12 meses: la untuosidad láctea de oveja pide a gritos esta veta de acidez, y la sal abre el pomelo de par en par."
