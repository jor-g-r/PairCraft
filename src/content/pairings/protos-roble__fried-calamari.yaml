wine: protos-roble
dish: fried-calamari
explanation: Protos Roble's cherry fruit and cedar grip match the calamari's
  medium weight while the acid slices through fry oil, keeping every bite as
  clean as the first.
explanationEs: "La fruta de cereza y el agarre de cedro del Protos Roble igualan el peso medio de los calamares, mientras la acidez corta el aceite de la fritura y deja cada bocado tan limpio como el primero."
