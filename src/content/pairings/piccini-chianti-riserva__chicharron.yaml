wine: piccini-chianti-riserva
dish: chicharron
explanation: "Chianti’s acid is built for pork fat: sour cherry slices through
  the crackling, and the salt softens the Riserva’s tannin into something easy."
explanationEs: "La acidez del Chianti está hecha para la grasa de cerdo: la
  cereza ácida atraviesa el chicharrón, y la sal suaviza el tanino del Riserva
  hasta volverlo amable."
