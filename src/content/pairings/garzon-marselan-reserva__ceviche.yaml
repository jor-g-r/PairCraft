wine: garzon-marselan-reserva
dish: ceviche
explanation: The lime and salt in the ceviche lock onto Garzón Marselan's mineral grit and red fruit — acid meets acid, brine amplifies the berry, and the mint cuts clean through the chili heat.
explanationEs: "La lima y la sal del ceviche se enganchan con la mineralidad y la fruta roja del Garzón Marselan: ácido con ácido, la salazón amplifica el fruto del bosque y la menta corta limpiamente el picante del ají."
