wine: trapiche-broquel-torrontes
dish: cerdo-asado
explanation: Torrontés acid slices through pork belly's molten fat layers, and
  the crackling's salt detonates the jasmine and lychee wide open.
explanationEs: "La acidez del Torrontés corta las capas de grasa fundida de la panceta, y la sal del chicharrón abre de golpe el jazmín y el lichi."
