wine: pazo-barrantes-albarino
dish: oysters-raw
explanation: "Pazo Barrantes Albariño and raw oysters on the half-shell: salt meets salt, mineral meets brine, and the lemon wedge becomes redundant."
explanationEs: "Pazo Barrantes Albariño y ostras crudas en su concha: sal con sal, mineral con salmuera, y el gajo de limón sobra."
