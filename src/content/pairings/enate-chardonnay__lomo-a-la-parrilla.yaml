wine: enate-chardonnay
dish: lomo-a-la-parrilla
explanation: The coarse salt on punta de anca pulls the ripe apple and pineapple
  forward, the oak and vanilla lock onto the char, and the acidity resets the
  palate against every fatty bite.
explanationEs: "La sal gruesa sobre la punta de anca adelanta la manzana madura y la piña, la madera y la vainilla se aferran a la brasa, y la acidez limpia el paladar frente a cada bocado graso."
