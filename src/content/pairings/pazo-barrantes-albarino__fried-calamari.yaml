wine: pazo-barrantes-albarino
dish: fried-calamari
explanation: "Pazo Barrantes Albariño against fried calamari: acid cuts the fry
  oil, saline minerality locks onto the squid, and the lemon wedge on the plate
  becomes redundant."
explanationEs: "Pazo Barrantes Albariño frente a calamares fritos: la acidez corta el aceite de la fritura, la mineralidad salina se aferra al calamar, y la rodaja de limón del plato sobra."
