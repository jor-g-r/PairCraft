wine: piccini-chianti-riserva
dish: aceitunas
explanation: "Tuscany’s own bar snack: sour cherry and dried herbs meet the
  olive’s bitter edge, and the oil smooths the Riserva’s tannin."
explanationEs: "El bocado de barra de la Toscana: la cereza ácida y las hierbas
  secas encuentran el borde amargo de la aceituna, y el aceite suaviza el tanino
  del Riserva."
