wine: santa-carolina-reservado-carmenere
dish: fried-calamari
explanation: Carmenère's acid slices through the fry oil, and the wine's medium
  body doesn't bulldoze the squid — but squeeze that lemon; it bridges the
  wine's green pepper to the dish and keeps everything honest.
explanationEs: "La acidez del Carmenère atraviesa el aceite de la fritura y su cuerpo medio no aplasta el calamar; pero exprime ese limón: tiende un puente entre el pimiento verde del vino y el plato, y mantiene todo honesto."
