wine: trapiche-broquel-torrontes
dish: fried-calamari
explanation: "Broquel Torrontés against fried calamari: acid cuts fry grease,
  the jasmine and lemon zest echo the squeeze you're already reaching for."
explanationEs: "Broquel Torrontés frente a calamares fritos: la acidez corta la grasa de la fritura, y el jazmín y la piel de limón repiten el chorrito que ya ibas a exprimir."
