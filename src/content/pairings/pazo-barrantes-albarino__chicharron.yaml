wine: pazo-barrantes-albarino
dish: chicharron
explanation: "Saline Albariño against salted crackling: the acid strips the fat,
  the salt answers the wine’s own, and the peach rounds off the fried skin."
explanationEs: "Albariño salino frente a chicharrón salado: la acidez arrastra
  la grasa, la sal responde a la del vino y el melocotón redondea la piel
  frita."
