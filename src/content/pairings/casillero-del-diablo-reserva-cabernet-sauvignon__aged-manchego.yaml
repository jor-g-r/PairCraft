wine: casillero-del-diablo-reserva-cabernet-sauvignon
dish: aged-manchego
explanation: Aged manchego, 12-month, pulls the blackcurrant and dark plum
  forward in this Cab while the salt cuts the tannin's grip — the fat takes the
  acid's edge off, and the wine comes alive.
explanationEs: "El manchego curado de 12 meses adelanta la grosella negra y la ciruela oscura de este Cabernet mientras la sal afloja el agarre del tanino; la grasa suaviza el filo de la acidez y el vino cobra vida."
