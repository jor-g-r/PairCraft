wine: 1865-cabernet-sauvignon
dish: lomo-a-la-parrilla
explanation: "Punta de anca off live fire meets its match: tannin grips the protein, cedar echoes the char, and the coarse salt crust pulls blackcurrant and cassis straight to the front."
explanationEs: "La punta de anca a las brasas encuentra su pareja ideal: el tanino abraza la proteína, el cedro resuena con el ahumado, y la costra de sal gruesa lleva al primer plano el grosella negra y el cassis."
