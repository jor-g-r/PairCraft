wine: 1865-cabernet-sauvignon
dish: tabla-de-quesos
explanation: The manchego owns this pairing — salt pulls the cassis forward and aged funk meets cedar and tobacco head-on; skip the blue, which needs sweetness this wine refuses to give.
explanationEs: "El manchego domina este maridaje: la sal realza la grosella negra y la complejidad del curado encuentra de frente el cedro y el tabaco; olvídate del azul, que pide dulzura donde este vino no tiene intención de ceder."
