wine: mionetto-prosecco-brut
dish: jamon-serrano
explanation: "Prosecco and cured ham is the Veneto’s own aperitivo: pear and
  green apple turn sweeter against the salt, and the bubbles keep the fat from
  settling."
explanationEs: "Prosecco con jamón curado es el aperitivo del Véneto: la pera y
  la manzana verde se endulzan frente a la sal, y la burbuja no deja que la
  grasa se asiente."
