wine: trapiche-broquel-torrontes
dish: ribeye-grilled
explanation: Torrontés against a charred ribeye is a curiosity, not a conviction — the acid does cut the fat, but the wine's jasmine and lychee get steamrolled by the char.
explanationEs: "El Torrontés frente a un ribeye a la brasa es una curiosidad, no una convicción: la acidez sí corta la grasa, pero el jazmín y el lichi del vino quedan aplastados por el ahumado."
