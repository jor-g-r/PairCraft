wine: norton-malbec
dish: salmon-a-la-parrilla
explanation: The mocha and cedar in this Malbec lock onto the char marks on grilled salmon — oak meets smoke — while the acidity cuts through the fat of the flesh bite after bite.
explanationEs: El moca y el cedro de este Malbec se enganchan con las marcas de brasa del salmón a la parrilla —roble sobre humo— mientras la acidez corta la grasa de la carne bocado a bocado.
