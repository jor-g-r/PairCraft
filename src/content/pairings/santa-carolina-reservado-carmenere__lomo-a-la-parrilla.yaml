wine: santa-carolina-reservado-carmenere
dish: lomo-a-la-parrilla
explanation: Punta de anca off live fire — charred crust, coarse salt — pulls
  the blackberry forward, while cedar and toast lock onto the smoke and tannin
  scrubs the fat clean.
explanationEs: "La punta de anca a fuego vivo —corteza carbonizada, sal gruesa— adelanta la mora, mientras el cedro y el tostado se aferran al humo y el tanino limpia la grasa."
