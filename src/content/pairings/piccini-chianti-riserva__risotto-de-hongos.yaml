wine: piccini-chianti-riserva
dish: risotto-de-hongos
explanation: Chianti Riserva's sour-cherry acid slices through the
  butter-and-parmesan richness of risotto de hongos, while the parmesan's salt
  pops the fruit and the leather-and-dried-herb backbone locks onto wild
  mushroom earth.
explanationEs: "La acidez y la cereza ácida del Chianti Riserva cortan la riqueza de mantequilla y parmesano del risotto de hongos, mientras la sal del parmesano hace estallar la fruta y el fondo de cuero y hierbas secas se aferra a la tierra de los hongos silvestres."
