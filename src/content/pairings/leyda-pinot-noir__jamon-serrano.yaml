wine: leyda-pinot-noir
dish: jamon-serrano
explanation: Low tannin leaves the delicate cure alone, cool-climate acid cuts
  the fat, and the ham’s salt draws cherry and earth out of the glass.
explanationEs: El tanino bajo respeta la curación delicada, la acidez de clima
  frío corta la grasa y la sal del jamón saca de la copa la cereza y la tierra.
