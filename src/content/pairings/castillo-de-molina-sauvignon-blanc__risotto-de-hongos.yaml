wine: castillo-de-molina-sauvignon-blanc
dish: risotto-de-hongos
explanation: The blade of acid in this Sauvignon Blanc slices through the
  butter-glossed cream of hongos risotto, and the parmesan's salt throws the
  grapefruit and green apple forward with every bite.
explanationEs: "La hoja de acidez de este Sauvignon Blanc atraviesa la crema brillante de mantequilla del risotto de hongos, y la sal del parmesano adelanta el pomelo y la manzana verde en cada bocado."
