wine: pazo-barrantes-albarino
dish: aged-manchego
explanation: "Aged manchego, 12 months: the salt pulls the peach and citrus
  forward, the acid slices through the fat, and the wine resets clean every
  time."
explanationEs: "Manchego curado, 12 meses: la sal adelanta el melocotón y los cítricos, la acidez corta la grasa, y el vino deja el paladar limpio cada vez."
