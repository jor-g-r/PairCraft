wine: moet-chandon-brut-imperial
dish: fried-calamari
explanation: Fried calamari, battered and golden, meets its match in Moët Brut
  Impérial — bubbles and acid scrub the oil clean, and the lemon zest in both
  pulls the whole thing tight.
explanationEs: "Calamares fritos, rebozados y dorados, encuentran su par en el Moët Brut Impérial: la burbuja y la acidez limpian el aceite, y la piel de limón de ambos lo ata todo."
