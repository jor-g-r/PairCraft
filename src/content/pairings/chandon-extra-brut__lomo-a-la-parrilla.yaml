wine: chandon-extra-brut
dish: lomo-a-la-parrilla
explanation: Coarse salt on the punta de anca pulls green apple and grapefruit straight out of the glass; the bubbles and backbone acid scrub the char fat clean between every bite.
explanationEs: La sal gruesa sobre la punta de anca dispara manzana verde y pomelo directamente de la copa; las burbujas y la acidez estructural limpian la grasa chamuscada entre cada bocado.
