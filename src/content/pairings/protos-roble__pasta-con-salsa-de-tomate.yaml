wine: protos-roble
dish: pasta-con-salsa-de-tomate
explanation: Protos Roble's cherry-driven acidity holds its ground against a
  sharp tomato sauce, and the parmesan salt pulls the fruit forward.
explanationEs: "La acidez de cereza del Protos Roble aguanta firme frente a una salsa de tomate punzante, y la sal del parmesano adelanta la fruta."
