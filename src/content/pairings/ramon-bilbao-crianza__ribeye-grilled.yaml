wine: ramon-bilbao-crianza
dish: ribeye-grilled
explanation: Ribeye's charred crust calls the vanilla oak forward; tannin meets
  protein, acid cuts fat, and the finishing salt makes the cherry snap.
explanationEs: "La costra tostada del ribeye llama a la vainilla del roble; el tanino encuentra la proteína, la acidez corta la grasa y la sal final hace estallar la cereza."
