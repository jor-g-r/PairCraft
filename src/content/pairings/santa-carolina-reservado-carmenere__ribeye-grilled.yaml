wine: santa-carolina-reservado-carmenere
dish: ribeye-grilled
explanation: Charred ribeye pulls the cedar and toast out of this Carmenère
  while tannin meets protein and acid cuts through the fat, leaving the palate
  clean for the next bite.
explanationEs: "El ribeye a la parrilla saca el cedro y el tostado de este Carmenère mientras el tanino encuentra la proteína y la acidez corta la grasa, y el paladar queda limpio para el siguiente bocado."
