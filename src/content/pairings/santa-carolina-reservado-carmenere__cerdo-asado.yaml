wine: santa-carolina-reservado-carmenere
dish: cerdo-asado
explanation: The salt crust on cerdo asado pulls the blackberry and black plum
  forward; cedar and light toast lock onto the crackling, and the acid slices
  through the fat so the next bite lands clean.
explanationEs: "La costra salada del cerdo asado adelanta la mora y la ciruela negra; el cedro y un tostado ligero se aferran al chicharrón, y la acidez atraviesa la grasa para que el siguiente bocado llegue limpio."
