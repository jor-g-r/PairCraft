wine: protos-roble
dish: aged-manchego
explanation: "Aged manchego, 12 months: the salt detonates the red cherry, the
  fat surrenders to the acid, and Ribera and Castilla shake hands across the
  plate."
explanationEs: "Manchego curado, 12 meses: la sal hace estallar la cereza roja, la grasa se rinde ante la acidez, y Ribera y Castilla se dan la mano sobre el plato."
