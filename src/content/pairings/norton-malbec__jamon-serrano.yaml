wine: norton-malbec
dish: jamon-serrano
explanation: "Jamón on an Argentine picada with Norton’s plum and blueberry: the
  salt pushes the fruit forward and the Malbec’s acid cuts the fat between
  slices."
explanationEs: "Jamón en una picada argentina con la ciruela y el arándano del
  Norton: la sal empuja la fruta y la acidez del Malbec corta la grasa entre
  loncha y loncha."
