wine: pazo-barrantes-albarino
dish: lomo-a-la-parrilla
explanation: The coarse salt crust on punta de anca yanks the peach and citrus out of this Albariño, and the acid slices straight through the fat with every bite.
explanationEs: La costra de sal gruesa en la punta de anca dispara los matices de melocotón y cítricos de este Albariño, mientras la acidez corta la grasa limpiamente en cada bocado.
