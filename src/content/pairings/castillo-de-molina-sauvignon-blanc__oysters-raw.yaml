wine: castillo-de-molina-sauvignon-blanc
dish: oysters-raw
explanation: The blade of acid and grapefruit pith in this Sauvignon Blanc
  matches the lean weight of raw oysters — light meets light, brine meets
  citrus, and the lemon wedge becomes redundant.
explanationEs: "La hoja de acidez y la piel de pomelo de este Sauvignon Blanc igualan el peso ligero de las ostras crudas: ligero con ligero, salmuera con cítrico, y la rodaja de limón sobra."
