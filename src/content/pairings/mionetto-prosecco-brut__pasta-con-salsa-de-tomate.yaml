wine: mionetto-prosecco-brut
dish: pasta-con-salsa-de-tomate
explanation: Prosecco's sharp acidity holds its ground against tomato's bite,
  and the parmesan salt pulls the green apple and pear forward so both the wine
  and the sauce taste brighter than either does alone.
explanationEs: "La acidez afilada del Prosecco se sostiene frente al mordisco del tomate, y la sal del parmesano adelanta la manzana verde y la pera, de modo que el vino y la salsa saben más vivos juntos que por separado."
