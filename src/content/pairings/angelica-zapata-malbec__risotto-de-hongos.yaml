wine: angelica-zapata-malbec
dish: risotto-de-hongos
explanation: The aged parmesan and wild mushrooms in this risotto pull the
  Zapata's leather and tobacco to the surface while the acid slices through the
  butter gloss and the salt makes the black plum crack open.
explanationEs: "El parmesano curado y los hongos silvestres de este risotto sacan a la superficie el cuero y el tabaco del Zapata mientras la acidez corta el brillo de la mantequilla y la sal hace estallar la ciruela negra."
