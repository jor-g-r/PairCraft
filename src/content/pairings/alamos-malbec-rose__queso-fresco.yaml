wine: alamos-malbec-rose
dish: queso-fresco
explanation: "Salt amplifies fruit: fresh cheese turns the rosé’s strawberry and watermelon brighter, while the wine’s acid keeps every bite light."
explanationEs: "La sal amplifica la fruta: el queso fresco aviva la fresa y la sandía del rosado, mientras la acidez del vino mantiene ligero cada bocado."
