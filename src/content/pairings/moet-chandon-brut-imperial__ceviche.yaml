wine: moet-chandon-brut-imperial
dish: ceviche
explanation: "Lime-cured sea bass ceviche: the dish's acid meets the Brut's acid
  as equals, and the salt snaps the green apple and white peach into focus."
explanationEs: "Ceviche de lubina curado en lima: la acidez del plato y la del Brut se miden de igual a igual, y la sal pone en foco la manzana verde y el melocotón blanco."
