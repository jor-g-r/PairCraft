wine: moet-chandon-brut-imperial
dish: queso-fresco
explanation: "Champagne needs nothing louder than fresh cheese: acid and mousse cut the lactic cream, and the salt draws pear and white peach out of the glass."
explanationEs: "El Champagne no pide nada más estridente que un queso fresco: la acidez y la burbuja cortan la crema láctica, y la sal saca de la copa la pera y el melocotón blanco."
