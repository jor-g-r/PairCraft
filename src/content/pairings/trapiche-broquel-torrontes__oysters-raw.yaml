wine: trapiche-broquel-torrontes
dish: oysters-raw
explanation: Torrontés's grapefruit zest and lean acid mirror the brine and
  lemon without drowning the oyster — light meets light.
explanationEs: "La piel de pomelo y la acidez magra del Torrontés reflejan la salmuera y el limón sin ahogar la ostra: ligero con ligero."
