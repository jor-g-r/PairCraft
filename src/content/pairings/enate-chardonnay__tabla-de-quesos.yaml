wine: enate-chardonnay
dish: tabla-de-quesos
explanation: Salt from the manchego and azul pulls the ripe apple and pineapple forward; the wine's body matches the fat, and its acid scrubs the creaminess clean between bites.
explanationEs: La sal del manchego y el azul realza la manzana madura y la piña; el cuerpo del vino acompaña la grasa y su acidez limpia la cremosidad entre bocado y bocado.
