wine: enate-chardonnay
dish: fried-calamari
explanation: Enate Chardonnay's acid slices through the fry oil on calamari, and the body is broad enough to hold its own against the batter.
explanationEs: La acidez del Enate Chardonnay corta el aceite de fritura de los calamares, y su cuerpo es lo bastante amplio para imponerse ante el rebozado.
