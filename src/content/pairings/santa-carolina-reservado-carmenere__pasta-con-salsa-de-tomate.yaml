wine: santa-carolina-reservado-carmenere
dish: pasta-con-salsa-de-tomate
explanation: Carmenère's matched acidity holds the tomato's sharp edge upright, and parmesan salt pulls the blackberry forward where it belongs.
explanationEs: La acidez equilibrada de la Carmenère sostiene el filo ácido del tomate, y la sal del parmesano proyecta la mora hacia el primer plano, justo donde debe estar.
