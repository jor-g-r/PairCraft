wine: enate-chardonnay
dish: salmon-a-la-parrilla
explanation: The Enate's toasted oak locks onto the grill char while its acid slices through salmon's fat — body meets body, smoke meets smoke.
explanationEs: "El roble tostado del Enate se funde con el ahumado de la parrilla mientras su acidez corta la grasa del salmón: cuerpo con cuerpo, humo con humo."
