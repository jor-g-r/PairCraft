wine: trapiche-broquel-torrontes
dish: risotto-de-hongos
explanation: Torrontés acid slices through butter-glossed Arborio, and the
  parmesan salt detonates the jasmine and lychee — the wine punches three weight
  classes above its price.
explanationEs: "La acidez del Torrontés atraviesa el arborio brillante de mantequilla, y la sal del parmesano hace estallar el jazmín y el lichi: el vino pelea tres categorías por encima de su precio."
