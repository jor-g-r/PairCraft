wine: casillero-del-diablo-reserva-cabernet-sauvignon
dish: empanadas-de-carne
explanation: "Medium-weight Cabernet for a fried snack: firm tannin meets the
  beef, acid cuts the crust, and blackcurrant stands up to the ají."
explanationEs: "Un Cabernet de peso medio para un bocado frito: el tanino firme
  encuentra la carne, la acidez corta la costra y la grosella negra le hace
  frente al ají."
