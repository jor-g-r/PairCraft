wine: chandon-extra-brut
dish: salmon-a-la-parrilla
explanation: Chandon Extra Brut against grilled salmon — carbonation lifts the
  fat, citrus snap meets the lemon crust, and the brioche note locks onto the
  char.
explanationEs: "Chandon Extra Brut con salmón a la parrilla: la burbuja levanta la grasa, el chasquido cítrico encuentra la costra de limón y la nota de brioche se engancha al tostado."
