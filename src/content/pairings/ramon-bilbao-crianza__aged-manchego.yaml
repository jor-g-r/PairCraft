wine: ramon-bilbao-crianza
dish: aged-manchego
explanation: The salt in aged manchego pulls the red cherry forward, the acid
  cuts the sheep-fat clean, and the leather in the Crianza meets the cheese's
  own barnyard depth head-on.
explanationEs: "La sal del manchego curado adelanta la cereza roja, la acidez limpia la grasa de oveja y el cuero del Crianza se enfrenta de lleno a la profundidad rústica del queso."
