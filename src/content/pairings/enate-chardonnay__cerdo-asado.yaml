wine: enate-chardonnay
dish: cerdo-asado
explanation: Cerdo asado's molten fat layers meet their match in Enate's
  full-bodied, oaked Chardonnay — vanilla and toast echo the roast, acidity
  resets the fat, and the crackling's salt pulls the ripe apple fruit forward
  with every bite.
explanationEs: "Las capas de grasa fundida del cerdo asado encuentran su pareja en el Enate Chardonnay, con cuerpo y madera: la vainilla y el tostado hacen eco del asado, la acidez limpia la grasa y la sal del chicharrón adelanta la manzana madura en cada bocado."
