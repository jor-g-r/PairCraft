wine: angelica-zapata-malbec
dish: cerdo-asado
explanation: The salt-forward crackling drives the Malbec's black plum and
  violet forward while the cedar-and-toast oak locks onto the roasted fat —
  acidity resets the palate, fat softens the tannin, and neither blinks.
explanationEs: "El chicharrón salado empuja al frente la ciruela negra y la violeta del Malbec mientras la madera de cedro y tostado se aferra a la grasa asada: la acidez limpia el paladar, la grasa suaviza el tanino, y ninguno parpadea."
