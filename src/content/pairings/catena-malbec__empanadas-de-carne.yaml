wine: catena-malbec
dish: empanadas-de-carne
explanation: "Tannin meets protein: stewed beef softens Catena’s grip, acid
  slices the fried crust, and the salt pushes black plum and violet to the
  front."
explanationEs: "El tanino encuentra la proteína: la carne guisada suaviza el
  agarre del Catena, la acidez corta la costra frita y la sal adelanta la
  ciruela negra y la violeta."
