name: Catena Malbec
tagline: Mendoza in a glass — black plum, violet, and the spine of the Andes.
summary: "Catena Malbec is the benchmark: ripe blackberry and plum with a violet
  lift, firm enough tannin to mean business, and oak that stays in its lane.
  Drink it with charred ribeye or lamb shoulder — tannin meets protein, and the
  fruit holds its ground. This is why Mendoza matters."
