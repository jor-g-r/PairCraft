tagline: Mendoza at its most accessible — dark plum, violet, and a smack of mocha without the pretension.
summary: "Norton's entry-level Malbec is the benchmark for what Mendoza does at volume without cutting corners: ripe, dark-fruited, and oak-touched but not buried in it. Drink it now, with food, at the table — this is not a cellar candidate."
