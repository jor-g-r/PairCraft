name: Leyda Pinot Noir
tagline: Pacific fog in a glass — cherry, earth, and spice from Chile's coolest corner.
summary: "Leyda sits twelve miles from the Pacific and it shows: this is Pinot
  Noir with genuine tension, not the jammy imposter that warmer Chilean valleys
  produce. Drink it with seared salmon or roast duck breast — low tannin, bright
  acid, and it holds its line. The grape's whole argument for versatility is
  made right here."
