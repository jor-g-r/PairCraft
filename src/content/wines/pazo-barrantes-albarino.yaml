name: Pazo Barrantes Albariño
tagline: Galicia in a glass — salt air, peach, and citrus that makes seafood inevitable.
summary: "Pazo Barrantes is the benchmark Albariño: saline, taut, and driven by
  acid that slices through anything the Atlantic pulls from the water. Drink it
  cold, drink it young, drink it with percebes or grilled turbot and stop
  overthinking it. This is the wine that teaches you why geography and grape
  variety can be the same argument."
