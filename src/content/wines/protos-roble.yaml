name: Protos Roble
tagline: Ribera entry-level done right — red cherry, cedar dust, and enough grip
  to demand a plate of food.
summary: Young Tempranillo from Ribera del Duero aged briefly in American and
  French oak, giving structure without weight. Drink it with something off the
  grill; this wine is built for the table, not the cellar.
