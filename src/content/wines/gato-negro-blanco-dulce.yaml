name: Gato Negro Blanco Dulce
tagline: Chile's sweet crowd-pleaser — peach, honeyed tropical fruit, and floral
  lift at a price that demands no apology.
summary: Gato Negro Blanco Dulce is a soft, uncomplicated sweet white built on
  ripe peach and tropical fruit with a honeyed finish that signals exactly what
  it is. Serve it cold with fresh fruit tarts or mild blue cheese — sweetness
  meets sweetness, or sugar cuts salt. It is the entry point where drinkers
  learn that sweetness is a tool, not a flaw.
