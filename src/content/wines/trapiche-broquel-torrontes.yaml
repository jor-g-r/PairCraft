name: Trapiche Broquel Torrontés
tagline: Salta's aromatic firepower bottled cheap — jasmine, white peach, and
  grapefruit zest with acid that keeps it honest.
summary: Broquel Torrontés is the entry point for understanding why Argentina's
  north produces the world's most perfumed white grape. Fermented cold to lock
  in aromatics, it delivers explosive floral attack balanced by genuine acidity
  — rare for the variety. Drink it within two years, ice-cold, with something
  that can stand up to the scent.
color: white
region: salta
