taglineEs: "Rioja en ropa de trabajo: cereza roja, roble con vainilla y cuero haciendo exactamente lo que la crianza prometió."
summaryEs: "Ramón Bilbao Crianza es Tempranillo con un año en roble americano y un año en botella, y se nota: cereza roja y ciruela en la entrada, vainilla y especias en el medio, cuero en el final. Sírvalo con chuletas de cordero o manchego curado, sin dudarlo un instante. Este es el vino que explica por qué Rioja construyó su reputación sobre el sistema de crianza."
styleEs: Rioja Crianza
