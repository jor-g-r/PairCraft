name: Ramón Bilbao Crianza
tagline: Rioja in its working clothes — red cherry, vanilla oak, and leather
  doing exactly what crianza promised.
summary: "Ramón Bilbao Crianza is Tempranillo with a year in American oak and a
  year in bottle, and it shows: red cherry and plum up front, vanilla and spice
  in the middle, leather at the finish. Drink it with lamb chops or aged
  manchego, not a moment's hesitation. This is the wine that explains why Rioja
  built its reputation on the crianza system."
