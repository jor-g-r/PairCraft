name: Castillo de Molina Sauvignon Blanc Reserva
tagline: Chile's Andes-cooled answer to Sancerre — grapefruit pith, cut grass,
  and a blade of acid.
summary: "Castillo de Molina Reserva is a textbook high-wire act: grapefruit,
  green herb, and green apple held together by acid sharp enough to strip fat
  off a plate. Drink it cold, drink it fast, drink it with ceviche or raw
  oysters — acid cuts through everything. This is the wine that teaches you why
  acidity is a food tool, not a flaw."
color: white
region: central-valley
