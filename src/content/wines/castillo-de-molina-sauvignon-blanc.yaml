taglineEs: "La respuesta chilena, refrescada por los Andes, al Sancerre: pomelo amargo, hierba recién cortada y una cuchilla de acidez."
summaryEs: "Castillo de Molina Reserva es un ejercicio de equilibrio de manual: pomelo, hierba verde y manzana verde sostenidos por una acidez lo bastante afilada como para limpiar la grasa de un plato. Sírvalo frío, bébaselo rápido, acompáñelo con ceviche u ostras crudas: la acidez lo atraviesa todo. Este es el vino que enseña por qué la acidez es una herramienta gastronómica, no un defecto."
styleEs: Sauvignon Blanc chileno
pedagogicalRoleEs: Blanco herbáceo de alta acidez; ideal para aprender sobre acidez, frescura y maridajes con mariscos y ceviche
