name: Catena Malbec
vintage: 2021
tagline: Mendoza incarnate — violets, plum, and altitude in a glass.
summary: >-
  A reliable benchmark for what high-altitude Mendoza Malbec wants to be:
  dark fruit pushed forward, violets behind it, tannin polished by oak
  rather than green. Drink it young; it rewards food more than patience.
color: red
region: mendoza
grapes:
  - grape: malbec
    percentage: 100
