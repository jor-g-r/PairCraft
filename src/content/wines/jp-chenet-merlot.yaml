name: JP Chenet Merlot
tagline: Supermarket Merlot done honestly — soft plum, a whisper of oak, and zero pretension. Drink it, don't study it.
summary: "JP Chenet Merlot is a high-volume Pays d'Oc red built for immediate drinking: soft tannins, ripe plum fruit, and just enough structure to hold a weeknight meal together. It is not a wine for cellaring or contemplation. Open it, pour it, move on."
