name: Piccini Chianti Riserva
tagline: Tuscany in a glass — sour cherry, dried herbs, and the acid that makes tomato sing.
summary: "Piccini's Chianti Riserva is Sangiovese doing exactly what Sangiovese was born to do: high acid, savory depth, and a spine of tannin that demands food. Drink it with anything that has a tomato base or a char on it — the wine sharpens both. This is the benchmark for understanding why Italian reds and Italian cooking are inseparable."
