summaryEs: "Este es un Carmenère de entrada de gama bien resuelto: fruta oscura en primer plano, esa inconfundible columna vertebral de pirazinas y la madera justa para redondear aristas sin sepultar la uva. Bébase ahora con algo a la parrilla — no necesita guarda y no pretende necesitarla."
