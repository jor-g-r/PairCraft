name: Santa Carolina Reservado Carmenère
tagline: Chile's signature grape at its most honest — blackberry, green pepper, and smoked meat without apology.
summary: "This is entry-level Carmenère done right: dark fruit up front, that unmistakable pyrazine spine, and enough oak to round the edges without burying the grape. Drink it now with something off the grill — it does not need cellaring and does not pretend to."
