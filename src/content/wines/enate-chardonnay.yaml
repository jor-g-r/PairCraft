name: Enate Chardonnay
tagline: Somontano's answer to Burgundy — ripe apple, butter, and vanilla with the body to back it up.
summary: "Enate's Chardonnay is barrel-fermented Spanish sun in a glass: pineapple and toasted oak riding a broad, creamy frame. Drink it with roast chicken thighs or a plate of aged Idiazabal — fat needs fat. This is the wine that teaches you what oak and lees actually do to texture."
