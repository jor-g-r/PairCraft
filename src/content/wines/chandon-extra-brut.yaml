name: Chandon Extra Brut
tagline: Mendoza bubbles with backbone — green apple, brioche, and a citrus snap
  that earns its keep at the table.
summary: Chandon Argentina's Extra Brut is a high-altitude sparkling built for
  food, not ceremony. Pinot Noir and Chardonnay deliver crisp green fruit and
  lees-driven biscuit character with genuine freshness. Drink it cold, drink it
  now, drink it with something salty.
