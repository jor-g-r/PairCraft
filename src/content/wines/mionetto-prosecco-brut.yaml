name: Mionetto Prosecco Brut
tagline: Northern Italy's aperitif workhorse — green apple, pear, and relentless
  bubbles at a price that demands no apology.
summary: "Glera from the Veneto, made by the Charmat method: fresh, low-alcohol,
  built for the first pour of the evening. Drink it cold, drink it fast, drink
  it with fried calamari or prosciutto and melon — acid cuts fat, bubbles reset
  the palate. This is the wine that teaches you why sparkling exists before
  dinner, not during."
