name: Angélica Zapata Malbec
tagline: Mendoza's benchmark Malbec — black plum, crushed violet, and serious oak structure that demands a decade of patience.
summary: Catena's flagship single-varietal Malbec, sourced from high-altitude Adrianna and La Pirámide vineyards, built for the cellar not the couch. Dense, structured, and uncompromising — open it before 2027 only with a ribeye in hand. Give it ten years and it becomes something genuinely complex.
