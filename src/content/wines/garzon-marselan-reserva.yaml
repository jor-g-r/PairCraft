name: Garzón Marselan Reserva
tagline: Uruguay's dark horse — red fruit, cool mint, and mineral grit where you least expect it.
summary: "Marselan is Cabernet Sauvignon crossed with Grenache, and Garzón's Reserva shows exactly why the marriage works: the structure of one parent, the fruit of the other, tightened by Atlantic winds off Maldonado. Drink it with charred lamb chops or a ribeye rubbed with chimichurri — tannin meets protein, herb meets herb. It earns its place on any list that claims to look beyond France and Argentina."
