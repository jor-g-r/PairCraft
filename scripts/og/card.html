<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Alegreya Variable';
        src: url('{{FONTS}}/alegreya/files/alegreya-latin-wght-normal.woff2') format('woff2');
        font-weight: 400 900;
      }
      @font-face {
        font-family: 'Playfair Display Variable';
        src: url('{{FONTS}}/playfair-display/files/playfair-display-latin-wght-normal.woff2') format('woff2');
        font-weight: 400 900;
      }
      @font-face {
        font-family: 'Open Sans Variable';
        src: url('{{FONTS}}/open-sans/files/open-sans-latin-wght-normal.woff2') format('woff2');
        font-weight: 300 800;
      }
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 72px 80px 64px;
        background: #0e0e0e;
        color: #fafafa;
        font-family: 'Open Sans Variable', sans-serif;
      }
      .brand { display: flex; align-items: center; gap: 18px; }
      .brand .mark { width: 60px; height: 60px; }
      .brand .mark svg, .watermark svg { width: 100%; height: 100%; }
      .brand span { font-family: 'Alegreya Variable', serif; font-weight: 600; font-size: 46px; line-height: 1; padding-top: 6px; }
      h1 { font-family: 'Playfair Display Variable', serif; font-weight: 400; font-size: 88px; line-height: 1.15; }
      h1 em { font-style: normal; color: #bd0000; }
      .es { margin-top: 18px; font-family: 'Playfair Display Variable', serif; font-size: 36px; color: #a3a3a3; }
      .url { font-size: 26px; color: #a3a3a3; letter-spacing: 0.01em; }
      .watermark { position: absolute; right: 64px; bottom: 64px; width: 330px; height: 330px; opacity: 0.9; }
    </style>
  </head>
  <body>
    <div class="brand"><div class="mark">{{MARK}}</div><span>Paircraft</span></div>
    <div>
      <h1>Your <em>bottle</em>.<br />Tonight’s table.</h1>
      <p class="es">Tu botella. La mesa de hoy.</p>
    </div>
    <p class="url">pair-craft.vercel.app</p>
    <div class="watermark">{{MARK}}</div>
  </body>
</html>
